
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small Groups — slides</title>
<meta property="og:title" content="Small Groups">
<meta property="og:description" content="Mental World Modeling">
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280;--och:#a8843c;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
#head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
#head h1{font-size:17px;margin:0;color:var(--d);font-weight:650}
#head .sub{font-size:12.5px;color:var(--mute)}
#slidewrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--l);
  border-radius:10px;overflow:hidden;background:#fff;container-type:size}
.slide{position:absolute;inset:0;padding:5.2cqw 6cqw;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:var(--d);color:#fff;justify-content:center}
.slide.title h2{font-size:6.4cqw;line-height:1.12;margin:0 0 2.4cqh;font-weight:650}
.slide.title .meta{font-size:2.6cqw;color:var(--l)}
.slide h2{font-size:4.4cqw;line-height:1.15;margin:0 0 3.2cqh;color:var(--d);font-weight:650}
.slide .kicker{font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--och);margin-bottom:1.6cqh}
.slide ul{margin:0;padding-left:3.4cqw}
.slide li{font-size:2.9cqw;line-height:1.5;margin-bottom:1.7cqh;color:var(--ink)}
.slide p.lead{font-size:3.1cqw;line-height:1.45;margin:0;color:var(--ink)}
.slide .rule{height:.5cqh;background:var(--l);width:14cqw;margin-bottom:2.6cqh;border-radius:2px}
.frag{opacity:.16;transition:opacity .18s}
.frag.on{opacity:1}
#bar{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-size:12.5px;color:var(--mute)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#nav{display:flex;gap:8px}
#nav button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
  border-radius:7px;padding:4px 11px;cursor:pointer}
#nav button:hover{background:var(--vl)}
#narr{margin-top:14px;padding:14px 16px;background:var(--vl);border-radius:10px;
  font-size:15px;line-height:1.62;color:var(--ink);min-height:74px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#narr em{color:var(--mute)}
#hint{margin-top:10px;font-size:12px;color:var(--mute)}
@media(max-width:640px){#narr{font-size:14.5px}}
</style></head><body>
<div id="wrap">
  <div id="head"><h1>Small Groups</h1><span class="sub">Mental World Modeling</span></div>
  <div id="slidewrap"><div id="slidehost"></div></div>
  <div id="bar">
    <div id="nav"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button></div>
    <span id="count"></span>
    <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)" title="Jump to slide">
  </div>
  <div id="narr"></div>
  <div id="hint">Use arrow keys or space to advance.</div>
</div>
<script>
const FRAGS = {"1": "<div class=\"slide title\"><h2>Small Groups</h2><div class=\"meta\">Mental World Modeling</div></div>", "2": "<div class=\"slide\"><div class=\"kicker\">The idea</div><div class=\"rule\"></div><h2>The winter survival task.</h2><ul><li class=\"frag\">A plane goes down in a frozen forest and twelve salvaged items have to be ranked by how much they matter to staying alive — a lighter, newspaper, a compass, gauze, a knife, an air map, canvas, a shirt, whisky, chocolate, rope, an ax.</li><li class=\"frag\">There is an expert ranking, so error is measurable.</li><li class=\"frag\">Each person ranks alone first.</li></ul></div>", "3": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>What the discussion does</h2><p class=\"lead\">The animation shows the talk and the ranking side by side.</p><p class=\"lead frag\">Three error figures track along with it: how wrong the average member was alone, how wrong the simple pool of their four rankings is, and how wrong the ranking is after they argue.</p><p class=\"lead frag\">Pooling already helps before anyone says a word — four noisy rankings average out.</p></div>", "4": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>Groups of language models, on the same task</h2><p class=\"lead\">We ran the same kind of task with groups of LLM agents talking freely, and compared them against human groups on an open dataset.</p><p class=\"lead frag\">The agent groups **outperformed the human groups**, and gained more from discussion — their scores improved further after free conversation than the humans' did.</p><p class=\"lead frag\">The way they talked was different too.</p></div>"};
const NARR  = {"1": "The winter survival task. A plane goes down in a frozen forest and twelve salvaged items have to be ranked by how much they matter to staying alive — a lighter, newspaper, a compass, gauze, a knife, an air map, canvas, a shirt, whisky, chocolate, rope, an ax.\n\nThere is an expert ranking, so error is measurable. Each person ranks alone first. Then the group has to produce one ranking together.", "2": "The winter survival task. A plane goes down in a frozen forest and twelve salvaged items have to be ranked by how much they matter to staying alive — a lighter, newspaper, a compass, gauze, a knife, an air map, canvas, a shirt, whisky, chocolate, rope, an ax.\n\nThere is an expert ranking, so error is measurable. Each person ranks alone first. Then the group has to produce one ranking together.", "3": "The animation shows the talk and the ranking side by side. Three error figures track along with it: how wrong the average member was alone, how wrong the simple pool of their four rankings is, and how wrong the ranking is after they argue.\n\nPooling already helps before anyone says a word — four noisy rankings average out. The question is whether talking adds anything on top of that, and if so, which exchanges did the work.", "4": "We ran the same kind of task with groups of LLM agents talking freely, and compared them against human groups on an open dataset.\n\nThe agent groups **outperformed the human groups**, and gained more from discussion — their scores improved further after free conversation than the humans' did.\n\nThe way they talked was different too. Agent groups produced **more disagreements**, **more complex statements**, and a marked **preference for positive statements** compared with people. So the advantage doesn't come from being agreeable and converging quickly. It comes with more argument, not less.\n\nThat cuts against the intuition that synthetic groups would collapse into consensus. It also raises the obvious question for anyone thinking about mixed teams: whether an agent's willingness to disagree survives contact with a human who outranks it."};
const N = Object.keys(FRAGS).length;
let si = 1, cur = 0;
const host = document.getElementById('slidehost');
const narr = document.getElementById('narr');
const rng  = document.querySelector('#bar input');
function maxStep(){ return host.querySelectorAll('.frag').length; }
function md(t){
  return t.split(/\n\s*\n/).map(p =>
    '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
             .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/_(.+?)_/g,'<em>$1</em>') + '</p>').join('');
}
function render(){
  host.querySelectorAll('.frag').forEach((el,i)=> el.classList.toggle('on', i < cur));
  const M = maxStep();
  document.getElementById('count').textContent = 'slide ' + si + ' / ' + N + (si===N && cur>=M ? ' — end' : '');
  rng.max = N; rng.value = si;
  location.hash = si > 1 ? 's' + si : '';
}
function show(){ host.innerHTML = FRAGS[si]; narr.innerHTML = md(NARR[si] || ''); render(); }
function jump(n){ si = Math.min(Math.max(1,n), N); cur = 0; show(); }
function step(d){
  const M = maxStep();
  if (d > 0){ if (cur < M){ cur++; render(); } else if (si < N){ si++; cur = 0; show(); } }
  else { if (cur > 0){ cur--; render(); } else if (si > 1){ si--; show(); cur = maxStep(); render(); } }
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
});
function fromHash(){ const m = location.hash.match(/^#s(\d+)$/); if (m){ si = Math.min(Math.max(1,+m[1]),N); cur = 0; show(); } }
window.addEventListener('hashchange', fromHash);
document.getElementById('slidewrap').addEventListener('click', () => step(1));
// GitBook webframe handshake
function post(a){ if (window.parent !== window) window.parent.postMessage(a, '*'); }
post({action:'@webframe.ready'});
function sizeUp(){ post({action:'@webframe.resize', aspectRatio: 16/9, maxHeight: 900,
  size:{height: document.getElementById('wrap').scrollHeight}}); }
new ResizeObserver(sizeUp).observe(document.getElementById('wrap'));
fromHash(); show(); sizeUp();
</script></body></html>
