.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "79": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p079.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "80": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p080.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "81": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p081.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "82": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p082.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "83": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p083.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "84": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p084.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "85": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p085.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "86": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p086.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "87": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p087.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "88": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p088.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "89": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p089.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "90": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p090.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "91": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p091.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "92": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p092.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "93": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p093.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "94": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p094.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "95": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p095.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "96": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p096.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "97": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p097.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "98": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p098.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "99": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p099.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "100": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p100.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "101": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p101.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "102": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p102.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "103": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p103.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>", "104": "<div class=\"slide\"><div class=\"shp img\" style=\"left:0;top:0;width:100%;height:100%\"><img src=\"media/asu-brown-bag/p104.png\" alt=\"\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain\"></div></div>"}, NARR={"1": "", "2": "Hi, in today’s talk I’ll share my work on the application of human and AI decision-making in cybersecurity.", "3": "", "4": "The threat landscape is evolving at a high speed. Last year alone, there were roughly 4.76 million dollar loss caused through social engineering attacks like phishing. Ransomware is another big threat, causing around 5.3 million dollar loss.", "5": "", "6": "This is the reality for a lot of cyber defenders today.\nDozens of alerts hit the screen within seconds. A single misstep could mean missing a breach — or overreacting to a false alarm.\nBut with this speed and volume, even experienced analysts are left overwhelmed.\nBy the time you’ve figured out what’s happening, it may already be too late.", "7": "To cope with the pace, we turn to AI.\nIt can monitor constantly, react faster than any human, and scale across networks.\n\nBut here’s the problem:\nAI often acts without context — without understanding what’s at stake, or what’s reasonable.\nIt might block legitimate traffic, isolate the wrong host, or even escalate a situation it doesn’t fully understand.\n\nSpeed without strategy isn’t enough.\nSo the question becomes: what does it take for AI to act with the defender — not instead of them?", "8": "The goal isn't to replace humans — it's to build systems that work with them.\n\nImagine an AI that doesn't just react, but explains.\nOne that proposes actions based on telemetry, simulates the attacker's next move, and highlights what really matters — all while learning from how human analysts think and respond.\n\nThis is what it means to team up — combining AI’s speed and pattern recognition with human judgment and strategy.\n\nAnd that’s the vision behind the work I’m going to show you today.", "9": "I use game theory and reinforcement learning for autonomous defense. I use Cognitive Modeling to understand, predict, and collaborate with the humans on the cyber battlefield, including defenders, attackers, and end-users. I then use human-subject experimentation empirically evaluate the autonomous and human-AI defense techniques.", "10": "In today’s talk, I’ll start with reinforcement learning for autonomous defense, zoom out to Human‑AI team team defense, and then flip perspective to model the attacker’s mind. Please feel free to ask clarification questions during the presentation. I am also happy to answer any questions during the Q&A afterward.\n\nMy first project is about adaptive cyber deception.", "11": "", "12": "Deception has been used to engage and mislead the attackers. One major type of deception is to manipulate the network’s appearance so that the attacker can’t tell the true configuration of the network. Another major type is to deploy honey-files, or honey-pots, to mislead the attacker from valuable assets.\n\n\n\nGiven a secret s, a user releases a perturbed observable o to an untrusted actor according to the channel probability σL (o | s). The adversary uses inference σF (ˆ s | o) to obtain estimate ˆ s. Perturbation limits the private information that the adversary learns about the user.", "13": "Stackelberg Security Games have been used to model the strategic interaction between the defender and the attacker. \nThe cyber deception game, proposed by Schlenker in 2018, models the defender’s choice of deceptive network configurations and the attacker’s reconnaissance as a zero-sum game.\nThe Cyber Camouflage Games  proposed by Thakoor extended the model to general sum to capture the uncertainty about the attacker’s payoff.\nAnd the attack graph deception game proposed by Milani modeled the sequential actions of the attacker as a path on the attack graph.", "14": "However, no prior work considered the defender and attacker’s ability to adapt to their real-time observations.", "15": "The attackers can gather more information about the network overtime. For example, at the beginning of an attack, the attacker is only aware of the entry point to the network, while after gaining access to the first host in the network, the attacker can now collect extra information about all the neighboring machines as well.", "16": "The defenders can also get alerts about suspicious activity in the network through network package capture, file analysis logs, and many other tools that provide network and host visibility in real time.", "17": "We propose an Adaptive Cyber Deception Game, which is a two-player Markov game model that accounts for the sequential moves between the attacker and the defender.\nAt each turn, the defender first observes the network, the update its defense strategy. The attacker then conduct service to gather information about the defense strategy, and then update its attack strategy accordingly.", "18": "We build our game model on an attack graph that can be interpreted at various granularity. For example, each node can either represent an attack status, or a host in the network. Each edge either represent an attack vector to advance the attacker’s status, or the connectivity among the hosts. Each node is associated with a value. Each edge is associated with a probability to successfully go through that edge. The probability to successfully go through a fake edge is 0.", "19": "The defenders can take two types of actions on the attack graph, deceptive and protective. Deceptive actions include hiding a real edge, adding a fake edge, or modify the perceived value of a set of node.\nProtective action include the Monitoring of an edge, which can allow the defender to eradicate the attacker once it attempts to go through that edge.", "20": "Each abstract action on the attack graph can be translated to multiple deceptive capabilities. For example, the adding fake edge action can be implemented as adding a fake vulnerability to give the attacker the delusion of access to a host, or to make the attacker believe it successfully gained root access to a host, or to place honey file so that the attacker won’t go after the real valuable asset.", "21": "We assume two types of adversary: powerful and naive. The powerful attacker can see through the deceptions. The naive attacker takes the presented information as truth.", "22": "We studied the use of a reinforcement learning algorithm, proximal policy optimization, with self-play.\n\nThe attacker and the defender each maintains a policy network, which takes their current observation of the network as input and outputs a probability distribution over possible actions.\n\nThe attacker’s observation include its current location, the value of nodes, and the real and fake edges between the nodes. The action is to choose an outgoing edge to pass through", "23": "The defender can see the same information as well, and they are allowed to choose a tuple of defense actions simultaneously.", "24": "Concretely, in each training step, we collect experiences based on the players' current policies and then run the one-step update for the defender's and attacker's network parameters using PPO separately.\n\n\n\nthe attacker’s observation is encoded with Long Short-Term Memory (LSTM) network or the attacker to observe conflicting node values and different visible edges in the history", "25": "To gauge the potential of using RL for autonomous defense, we compared the PPO defender with an expert designed heuristic defender. We tested each defender against three types of attackers, including PPO attackers trained in the self-play, PPO attackers trained against the Heuristic defender, and a heuristic attacker. Within each type, we used both the powerful attacker and the naive attacker.\n\nThe heuristic defender will first try to change the perceived value of nodes to have the highest-valued node that is non-differentiable from others. If the budget is not exhausted after masking, the defender will then randomly hide a real edge, add a fake edge, or defend a real edge in the following steps.\n\nThe first 3 of them are naive, the last 3 of them are powerful. Among the naive attackers, we have a heuristic attacker, a PPO-based attacker trained against the heuristic defender, and a ppo-based attacker trained against a PPO defender.\nSame for the powerful category of attackers.\n\nThe heuristic attacker always moves to the observable node with the highest value. \n\n\nwhat are the attacker policies? mention them briefly and prepare backup slides\n\n The attackers we use are 1) the heuristic attacker; 2)  the PPO attacker trained against the heuristic defender; 3) the PPO attacker trained against a PPO defender in the PPO self-play.", "26": "We found that the PPO defender always outperforms the heuristic defender, against Naive attackers, and powerful attackers.", "27": "", "28": "To see if our agents learned stable strategies, and are already doing the best they can, given what the other is doing, we measure the exploitability of each pair of the policies. \nThe exploitability of a pair of policy is defined as the sum of the exploitability of the attacker’s policy, and the exploitability of the defender’s policy. \nThe attacker’s exploitability is calculated by the gap between the actual utility, and the counterfactual utility when the defender adopts the best response. Same thing applies for the defender.\nSo if the total exploitability is close to zero, it means neither side can gain much by changing their strategy — so the training likely reached equilibrium.", "29": "", "30": "Results showed that the pair of PPO-based attacker-defender policies is closer to a Nash equilibrium.", "31": "With the promising performance in simulation, we went on deploying RL-based defense strategy in a realistic network on AWS.  The network topology resembles a typical enterprise network with public facing subnets, internal subnets, and core operation subnet. The virtual machines in the network each have some recently disclosed vulnerabilities injected through obsolete softwares.\n\nSimplifications and Assumptions: Simulations typically involve simplifications and assumptions that do not hold in reality, such as perfect sensor accuracy or idealized physics.\nAdapting to Real World: Adapting models trained in simulations to the real world can be complex, requiring techniques like transfer learning, domain adaptation, or fine-tuning with real-world data.\nSample Efficiency: Gathering real-world data for adaptation can be costly and time-consuming, and models must efficiently leverage limited real-world samples.\nSimulated Scenarios Coverage: Ensuring that the simulated scenarios adequately cover the range of possible real-world conditions is challenging but essential for effective transfer.", "32": "We built a command and control architecture to collect sensor data from the network and deploys deception tactics like fake files and honeypots. \nTo make this tractable for reinforcement learning, we use a translation layer that turns raw logs and commands into vectorized representations. \nThe RL Defender Agent operates purely in abstract space — it receives a vectorized view of the world, selects an abstract deception strategy, and the system translates that back to concrete actions.\nBut from initial experiments, we found that the RL agents trained in simulation environments can be quite brittle, which is not entirely surprising because of the discrepancy between the simulator and the real network. \nIn reality, it is also unfeasible to build a high fidelity simulator for every network that we want to defend.", "33": "To bypass this problem,  we decide to train the RL agent in a real network directly. That is, instead of querying the policy network for next actions, we also update the policy with new experience.\nThe new challenge then, is that enacting real attack and defense actions in a real network is very time consuming.  Previously we can collect thousands of samples in a minute, but now it can take a whole minute to even enact an action in the real network.", "34": "So we are now trying to use sample-efficient reinforcement learning algorithms, like model-based reinforcement learning.\n\nThe first straightforward choice is Model-Based Policy Optimization (MBPO), as we have been using PPO. MBPO enhances sample efficiency by learning a  world model of the network environment, and the agent can collect samples through interaction with the learned model in addition to interacting with the real network.\n\nIn our current cybersecurity setup, the observation space is relatively minimal—essentially a binary indicator from each host's file watcher signaling asset access.​\n\nBut to be actually useful in a real network, we have extend our network's telemetry infrastructure, incorporating more detailed and potentially multi-modal data sources. This expansion necessitates us to explore advanced reinforcement learning methods like Dreamer, which operates by learning and planning within a latent space.​", "35": "The key idea is to construct a compact representation of the environment, and to simulate future trajectories internally and optimize the policy in the latent space. This approach has been proved particularly beneficial in environments with high-dimensional observations, such as visual pixel inputs.​\n\nHowever, the alerts or events in network telemetry can be quite different from visual pixels. They don’t have the spatial and temporal continuity as visual inputs, which can make it challenging for the model to interpolate and generalize.\n\nTo solve these problems, we are extending this architecture in two key ways to support strategic cyber defense.\n\nFirst, we replace the standard latent vector with a graph of latent variables — one per host or key entity in the network.\nThis gives the world model an inductive bias: it can propagate attacker influence across hosts using message passing, just like attacks spread laterally in a real network.\nDefensive actions like isolating a host can modify edge structure or node features, while attacker actions correspond to predicted changes in the graph — for example, compromise propagation.\n\nSecond, we introduce an explicit opponent model.\nSo instead of folding all attacker behavior into latent uncertainty, we train a separate module to model the attacker’s policy. This also serves as a form of belief modeling in partially observable games — helping the defender agent infer where the attacker might be and what they’re likely to do next.", "36": "So far, I’ve shown how reinforcement learning can be used to train adaptive defenders capable of outmaneuvering both naive and sophisticated attackers, and how we’ve even begun deploying these agents in real-world network environments.\n\nWhile autonomous defenses are promising, in high-stakes domains like cybersecurity, where actions can disrupt services or violate policies, we cannot afford to remove humans from the decision loop.\n\nSo it is important to find a way to make the RL agent work with humans as a team", "37": "Many questions need to be answered to make human-AI team defense possible. For example, how much autonomy do we want to grant to the AI partner? Do we want to use them solely for information management purposes, or do we want them to autonomously response to incidents and take risky actions?\n\nTo defend the evolving network against diverse adversaries, many AI tools have been developed in the recent years, there are SIEM, SOAR\n\nOn the defender side, there are human and AI components, it is a challenge to have these two parts work seamlessly together.\n\nCybersecurity professionals might be hesitant to rely on AI for making autonomous defensive actions, such as isolating parts of a network or deleting suspected malicious files, fearing unintended consequences.", "38": "Existing AI techniques for cybersecurity are used as tools rather than equal teammates of human analysts. This diagram demonstrates the structure of a typical cyber protection team. Ideally, we would like to offload some work of human analyst to an autonomous agent.", "39": "We propose a semi-supervisory Human-AI teaming paradigm as one potential way for human and AI to work together as a team. In real world, human analysts have a set of pre-approved actions they can take for incident response, without further approval of the authority. We consider the AI partner as a team member with a smaller set of pre-approved actions, which the agent can take on its own. While for the actions that are costly or risky, the agent need to get approval from its human supervisor.\n\nMonitor – Passive action to view network traffic.\nRemove – disconnect the service from all users.\nRestore – Turn service off completely are reset.\nMisinform – Add a honeypot distractor on a service.", "40": "", "41": "The human-agent team is assigned to defend an enterprise network together. Here is the topology of the network. The task for the attacker is to make its way through the network from the subnet 1 to subnet 3 and impact the service on Operational Server 0.", "42": "", "43": "The defender team’s goal is to stop the attacker from getting to the operational server, and minimize cumulative loss. \nIn addition to the loss induced by attacker’s access to the network, the defender is also punished for using the costly action: restoring a host or server, or deploy honeyfile on a host.", "44": "This is the interface for the human defender in the team, which presents them with updated network status and allow them to choose defense action and target. The agent is provided with the same information and will choose an action for itself.\nYou can scan the QR code to play a simpler version of this game.", "45": "More specifically, at each round, both the human participant and the AI agent are presented with the new network status, and each of them will present their intended defense action. The human is responsible to resolve conflicts when the human and agent are trying to take action on the same target and getting in each other’s way. \nThe human is also responsible for validating the agent’s decision if it choose to take one of the risky or costly actions. If the human decides it’s not the best to do so, they are allowed to modify the agent’s decision to something they see fit. They can also change their own course of action after seeing what the agent wants to do.\n\nMonitor – Passive action to view network traffic.\nRemove – disconnect the service from all users.\nRestore – Turn service off completely are reset.\nMisinform – Add a honeypot distractor on a service.", "46": "", "47": "To find out what makes a good autonomous agent teammate, we compared teams with humans and three types of agents, including a cognitive agent, which resembles human decision making process. It is a learning agent and can adapt to the environment & its teammate.", "48": "The second type is a heuristic agent, that take actions according to a fixed set of rules. This agent is not adaptive it is almost equally as competent as the cognitive agent.\n\nAnd finally the Random agent, that makes decisions completely randomly. It is neither adaptive, nor competent.", "49": "Thus, we expect the cognitive agent to be the best AI partner, followed by the heuristic partner, followed by the random partner", "50": "We recruited human participants from Amazon MTurk to team up with the agents.", "51": "The experiment starts with consent forms and demographic questions. The participants are then presented with instructions about the game, a quiz to test their understanding of the instructions, and a practice round for the to experience the potential situations they would encounter in the game. The participants are then assigned to play with one type of autonomous team mate, for 7 episodes, each with 25 steps. Afterwards, the participants takes a survey in which they give a score of their agent partner, and answer an open-ended questionnaire.", "52": "The first important finding is that cognitive partner had the highest performance than others. The figure shows the loss of human-AI team across seven episodes of interaction with the attacker. The blue line is the average loss of teams with a cognitive agent. Teams with the other competent agent -- the heuristic agent, is slightest worse, and the teams with random agent got most loss.", "53": "To see how much did the agents contributed to the team performance, we need to know if the agents’ actions were executed at all. This plot shows the proportions of agents’ decisions validated by their human partner. \nIt is interesting to see that the humans quickly learned to trust the competent agents. The proportion of agreement for Cognitive and Heuristic agents are much higher from the first episode.\n\nAnother interesting point is that the trend of the cognitive agent is downward and the trend of the heuristic agent is upward. From post-experiment questionnaires, we learned that the adaptivity of cognitive agents makes it unpredictable and difficult to work with. We will investigate this further in future studies.", "54": "As for the humans themselves, we found that the humans make the least effort when they are team with a cognitive agent. By effort we mean the humans actively take actions instead of monitoring the network. But further inspection shows that their actions are actually becoming more effective overtime, as shown in the efficiency panel. Human’s efficiency are increasing overtime when they are paired with Cognitive and Heuristic agent.", "55": "To better understand the humans rationale, we asked the participants comment on their agent teammate. It is evident that their perceptions of agents is largely affected by their high expectations for AI, which either led to blind trust or huge disappointment.\nFor example, a participant who teamed with a heuristic agent is very frustrated because the agent can’t communicate with them. The other participant who teamed with a random agent, however, had a great experience and trusted the partner more than themselves.\n\u000bSo we should not solely rely on likert scales of trustworthiness, and instead, we may want to look at things like effort or efficiency, as a behavioral signal of trust.", "56": "As pointed out by one of the participant, effective cyber defense requires coordinated multi-step strategies. Strategic collaboration is crucial, communication is important\n\nCyber defense requires coordinated, multi-step strategies. A simplistic \"one-step-at-a-time\" approach to cybersecurity, guided by a supervisory plan, is inadequate for addressing the complexity and unpredictability of real-world scenarios.\u000b\nStrategic collaboration is crucial. Humans and agents must co-create defense plans, continuously exchange information, and adapt dynamically to shifting adversarial tactics. Effective defense demands more than sequential task execution; it requires creative, joint problem-solving and distributed decision-making between human and AI teammates.\u000b\nA deeper understanding of task dynamics is needed. As researchers, we need a better grasp of the interdependencies and complexities within cybersecurity tasks. This knowledge will enable us to facilitate organic, flexible collaboration between human and AI agents, ensuring a synergy that supports adaptive defense in complex environments.", "57": "In our ongoing work, we are expanding the team defense game platform to support more realistic experiments for human-AI team defense. \nTo provide more diverse training scenarios, we designed an automatic team task generator to enforce inherent interdependence among the team members.\nWe use Jax to build the game environment so that experimenters can plug in  the state-of-the art RL based and Foundation model based agents seamlessly.\nFinally, to enable the interaction with more than one human team members, and the communication between humans and agents.", "58": "We’ve just seen how pairing a human analyst with a competent AI agent can lead to more effective cyber defense. But cybersecurity is rarely a solo task—defense teams must collaborate, pool information, and reach joint decisions under pressure.\n\nSo before we design AI agents to join these conversations, we need to first understand how human groups naturally solve problems together—what makes collaboration effective, where breakdowns occur, and how knowledge, opinions, and trust are shared or withheld.", "59": "One canonical task is attacker profiling—a process that often involves multiple analysts each bringing partial, sometimes ambiguous pieces of information to the table.\n\nSolving this kind of problem isn't just about analyzing data—it's about coordinating perspectives, deciding what information is relevant, and negotiating uncertainty as a team.\n\nIf the group fails to piece together key information, they may converge prematurely on the wrong culprit. Only when the right pieces are surfaced and aligned across members can the group correctly identify the actual attacker.", "60": "But in practice, human groups often struggle to collaborate effectively.\n\nIndividuals may fail to recognize how their knowledge connects to the group’s goal—not because the information is unimportant, but because they lack the global context to see its relevance. In complex tasks, people tend to focus on what’s directly in front of them, and miss opportunities to contribute what might be a crucial piece of the puzzle.\n\nOthers may withhold disagreement or uncertainty, even when they suspect the group is going down the wrong path. This can happen out of politeness, fear of being wrong, or simply because they assume someone else knows better. And as a result, groups can reach fast but fragile consensus—one that excludes dissenting insights that were never voiced", "61": "To investigate group reasoning in a controlled way, we started with a non-cyber task, since real cybersecurity data is often sensitive and not readily accessible for experimentation.\n\nThe Winter Survival Task offers a clean, well-established setting where the stakes are still high. After a plane crash in subzero conditions, a group must rank survival items in order of importance.\n\nLike attacker profiling, this task requires each member to share what they know—and explain why certain items matter. If they fail to identify the most critical items, the group could make a decision that costs them their lives.", "62": "Here’s a glimpse into what real human group conversations look like in the Winter Survival Task.\n\nWhat’s striking in this exchange is the asymmetry in participation. The pink participant takes a strong lead—asserting opinions early and confidently, often steering the group’s direction. The blue participant is actively engaged, echoing others and helping build consensus, but is generally more agreeable. And the green participant barely speaks.", "63": "Now the question is, can we do better? With large language models?\nTo explore this, we designed a large language model based agent for this group task.\nEach agent in the group observes utterances made by other agents during the conversation and remembers it using a conversation history. \nAfter observing an utterance, the agent first commit it to its memory of the conversation history,\nIt then update the ranking of the 15 items based on the new information received from that utterance\nWith the updated ranking, the agent decide whether it has anything to contribute to the group and need to grab the conversation \nFinally, if the agent chooses to speak up, it will generate natural language and express its opinion to others\nThe update of ranking, decision to grab the floor, and generation of natural language are all achieved by prompts to GPT-4", "64": "The language agents engage in free form conversation following this algorithm. Instead of imposing rules and orders for the conversational agents to talk, we let the agents decide for themselves whether to speak up and what to say.\nThe speaker who utters the first sentence initiates the conversation and grabs possession of the ”conversation floor.” \nThe remaining agents in the group observe what is being said by the speaking agent. \nThe speaker keeps the floor until another agent tries to claim the floor. \nIf more than one agent attempts to claim the floor, one of them is randomly chosen as the next speaker. \nIf no one attempts to claim the floor, the speaker keeps talking until the agent determines to release the floor to others. \nWhen the conversation floor is free, and a consensus has not yet been reached, the agents are repeatedly prompted to reassess the situation and decide whether to speak up. If none of the agents recognizes the obligation to speak up and continue the discussion, the conversation is ceased, and the group task ends in failure.", "65": "", "66": "To analyze how the participants & agents engage in group discussion, we annotated the dialogue along two key dimensions. On the left, you see the dialogue acts—what type of contribution each utterance represents, whether it’s a new proposal, an agreement, a disagreement, or a confirmation.\n\nOn the right, we capture the sentiment behind each message—whether it’s positive, neutral, or negative.\n\nThese annotations allow us to analyze not just what the agents are saying, but also how they’re interacting—socially, emotionally, and strategically.\n\nBoth are done automatically, with the state-of-the art algorithm on dialogue act classification and sentiment annotation tasks. The models are first fine-tuned on 60% of annotated human corpus, and achieved over 70% agreement with human labeler on the rest human corpus.", "67": "", "68": "We then compared following metrics of the human corpus and the synthetic metrics.\nGroup score is the distance from the ranking submitted by the group and expert’s ranking. Meeting length is to measure in terms of the number of words, since the agents are communicating through texts.\nAffect and Satisfaction measures include the sentiment labels of each utterance, and the post-experiment questionnaire about group work satisfaction. Same as human experiments, we prompted the large language agents to answer a questionnaire.\nFinally, in terms of group action, we measured the proportion of each type of dialogue act in the group conversations.", "69": "The first major finding is that agent groups perform better than human groups, agent groups achieved higher group scores than humans", "70": "The second major finding is that agent discussions involve more disagreements with each other.", "71": "There are also more complex statements, which are labeled as multiple dialogue acts. One utterance is often an agreement or disagreement followed by a proposal.", "72": "Finally, we find that agents participated in the discussion more equally than humans. In human groups, especially the groups with three or more members, there’s always one or two who are more actively engaged in the conversation, while the rest becomes bystanders.", "73": "", "74": "From the previous results, we saw that LLM agents can already outperform human groups in many ways—producing better solutions, engaging more equally, and even surfacing more nuanced disagreement.\n\nBut those gains came from simulating agent-only groups. The bigger question is: can an LLM agent meaningfully assist a human group?\n\nThere are two driving forces in group conversations: Gain information and Maintain relationship. \n\nOur vision is to build large language model powered agent to facilitate human groups along these two dimensions: Information wise, the agent will help can identify knowledge gap, and nudge the group toward most information topics; Relationship wise, the agent will model the group dynamics, modulate the sentimental tone of the conversation, and encourage equal participation in the conversation.", "75": "We've now covered the three core projects that form the backbone of my recent work on human-AI decision-making. Before I conclude, I want to briefly highlight a few other projects. These studies extend the same central theme — using AI to model, support, or collaborate with humans — in domains like group decision-making and adaptive behavior modeling.", "76": "This work tackles a core challenge in modeling human behavior — how people transfer what they've learned in one context to a new but related one.\n\nWe designed a sequential decision-making experiment using contextual bandit tasks, where features like shape, color, and texture are introduced step by step. Participants have to learn which combinations lead to higher rewards, and transfer that knowledge as the task becomes more complex.\n\nTo capture this behavior, we proposed a cognitive model that integrates compositional reasoning, causal inference, and optimal forgetting — three mechanisms inspired by how humans generalize and adapt.\n\nOur model not only fits human data better than standard baselines, but ablation studies show that each cognitive component contributes meaningfully to predicting human transfer behavior", "77": "In this work, we asked: what kinds of attackers are truly challenging for defenders?\n\nWe compared three types of attackers — a deterministic optimal attacker, a random attacker, and a cognitive attacker that adapts over time. Across simulations and human experiments, we found that adaptive, experience-driven attackers consistently posed the greatest challenge.\n\nDefenders—both automated and human—could eventually learn to stop strategic or random attackers. But against adaptive attackers, even experienced defenders struggled. These adversaries maintained pressure, forced defenders to consider more options, and resisted being exploited.\n\nThe takeaway is clear: if we want to prepare defenders for real-world threats, we need to train them against adaptive opponents that change as they lear", "78": "To better understand cooperation in small groups, I take both an empirical and theoretical approach.\n\nOn the empirical side, I conducted behavioral experiments using a three-player cybersecurity game where participants decide whether to share threat intelligence. The findings show that cooperation improves when incentives are stronger or when participants can observe others’ actions and outcomes. But interestingly, giving players full payoff information actually reduced cooperation—likely because it made the temptation to defect more salient and disrupted early trust formation​\n.\n\nTo explain these behavioral patterns, I developed a cognitive model of interdependent decision-making in groups. The model integrates three psychological mechanisms—dynamic prosociality, category learning, and contrast effects—to capture how people decide who to trust and how much. It not only reproduces key patterns from the experiment, like the shift from universal to selective cooperation, but also reveals how relationship imbalances and third-party effects emerge when people manage multiple social ties under cognitive constraints​", "79": "", "80": "", "81": "There are two directions I’m particularly interested in for making reinforcement learning more practical and trustworthy in real-world cyber defense. \n\nFirst, leverage domain knowledge.\nInstead of relying solely on trial-and-error, we can warm up the agent’s learning process by integrating knowledge graphs — capturing relationships between attack techniques, vulnerabilities, and system components.\nThese graphs can come from human experts, or increasingly, from language models like GPT, which we can use to extract and formalize cybersecurity knowledge from text.\n\nSecond, learn human feedback. This is another way to make the learning process more auditable, and allow us to trace why a behavior was reinforced.\nTraditional RLHF often relies on immediate preferences, which can be tricky because when you give a thumbs up or thumbs for each action, you might be training the RL agent to lie to you.\nSo in security settings, we need to combine immediate feedback with reflective feedback, to make sure the optimality of the sequence of actions in addition to aligning with human preferences.", "82": "In cybersecurity, we often expect defenders to be perfectly rational — to analyze every alert, weigh every outcome, and act optimally. But real defenders operate under real constraints: limited time, attention, and memory.\n\nComputational rationality asks a more realistic question: What’s the best decision someone can make, given their cognitive limits?\nInstead of maximizing utility alone, people make decisions that trade off performance against mental effort — captured in this formulation: E[Utility(π)−λ⋅Cost(π)]\nThe curve illustrating this trade-off: more effort gives higher utility, but only up to a point.\nThe resource-rational choice lies not at the far end — but at the sweet spot where the gain no longer justifies the cost.\nHere, π is the chosen strategy. Utility could be catching threats; cost might be cognitive load.\nAnd λ reflects how heavily effort is penalized.\n\nA concrete example is alert prioritization.\nCyber analysts are often overwhelmed by simultaneous alerts must decide where to focus.\nBy modeling cognitive limits, a computational rational agent can help prioritize — surfacing the most urgent or relevant threats, and pacing information flow.\nThis makes AI support not just responsive, but truly aligned with how humans make decisions under pressure.", "83": "", "84": "", "85": "", "86": "", "87": "", "88": "", "89": "This is the computational representation of the three key mechanisms that we proposed, the model learns a factorized Q-value of the states, update the causal links between a feature and the outcome when its weight drops under a certain threshold, and represent the forgetting process with this parameter zeta, which means the value of a feature will decay if it’s not frequently visited.\n\nWe were happy to validate our conjecture, and our model match human data much more accurately than previous methods.", "90": "", "91": "I conjecture that humans manage a large number of relationships through category learning and contrast effect. We form stereotypes about people and treat each “type” using the same attitude. The exact way of how we deal with each type of people is dynamic, and might be different in different contexts. This diagram illustrates the computational modeling of that intuitive process. We learn categories about people, decide how to treat them based on past interaction with that kind of people, and during this process, our experience might be extorted when there’s contrast between our friends.\nWe validated this model with an online experiment as well, and I am currently working on validating it with larger scale social network experiments.", "92": "", "93": "", "94": "", "95": "", "96": "", "97": "", "98": "", "99": "", "100": "", "101": "", "102": "", "103": "", "104": ""};
const N=Object.keys(FRAGS).length;
let si=1, cur=0;
const host=document.getElementById('host'), narr=document.getElementById('narr'),
      rng=document.querySelector('#bar input');
function steps(){ const t=(NARR[si]||''); return t? t.split(/\n\s*\n/).length : 1; }
function md(t){return t.split(/\n\s*\n/).map(p=>'<p>'+p
 .replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
 .replace(/_(.+?)_/g,'<em>$1</em>')+'</p>').join('');}
function render(){
 const parts=(NARR[si]||'').split(/\n\s*\n/);
 narr.innerHTML=md(parts.slice(0,cur+1).join("\n\n"));
 document.getElementById('count').textContent='slide '+si+' / '+N+
   (si===N&&cur>=steps()-1?' — end':'');
 rng.max=N; rng.value=si; location.hash=si>1?'s'+si:'';
 post({action:'@webframe.resize',size:{height:document.getElementById('wrap').scrollHeight}});
}
function show(){ host.innerHTML=FRAGS[si]||''; render(); }
function jump(n){ si=Math.min(Math.max(1,n),N); cur=0; show(); }
function step(d){
 const M=steps()-1;
 if(d>0){ if(cur<M){cur++;render();} else if(si<N){si++;cur=0;show();} }
 else   { if(cur>0){cur--;render();} else if(si>1){si--;show();cur=steps()-1;render();} }
}
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
 if(e.key===' '||e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1);}
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1);} });
document.getElementById('stage').addEventListener('click',()=>step(1));
function fromHash(){const m=location.hash.match(/^#s(\d+)$/); if(m){si=Math.min(Math.max(1,+m[1]),N);cur=0;show();}}
addEventListener('hashchange',fromHash);
function post(a){ if(window.parent!==window) window.parent.postMessage(a,'*'); }
post({action:'@webframe.ready'});
fromHash(); show();
</script></body></html>
