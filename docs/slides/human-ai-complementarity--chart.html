
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHART — slides</title>
<meta property="og:title" content="CHART">
<meta property="og:description" content="Human-AI Complementarity">
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280;--och:#a8843c;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
#head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
#head h1{font-size:17px;margin:0;color:var(--d);font-weight:650}
#head .sub{font-size:12.5px;color:var(--mute)}
#slidewrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--l);
  border-radius:10px;overflow:hidden;background:#fff;container-type:size}
.slide{position:absolute;inset:0;padding:5.2cqw 6cqw;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:var(--d);color:#fff;justify-content:center}
.slide.title h2{font-size:6.4cqw;line-height:1.12;margin:0 0 2.4cqh;font-weight:650}
.slide.title .meta{font-size:2.6cqw;color:var(--l)}
.slide h2{font-size:4.4cqw;line-height:1.15;margin:0 0 3.2cqh;color:var(--d);font-weight:650}
.slide .kicker{font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--och);margin-bottom:1.6cqh}
.slide ul{margin:0;padding-left:3.4cqw}
.slide li{font-size:2.9cqw;line-height:1.5;margin-bottom:1.7cqh;color:var(--ink)}
.slide p.lead{font-size:3.1cqw;line-height:1.45;margin:0;color:var(--ink)}
.slide .rule{height:.5cqh;background:var(--l);width:14cqw;margin-bottom:2.6cqh;border-radius:2px}
.frag{opacity:.16;transition:opacity .18s}
.frag.on{opacity:1}
#bar{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-size:12.5px;color:var(--mute)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#nav{display:flex;gap:8px}
#nav button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
  border-radius:7px;padding:4px 11px;cursor:pointer}
#nav button:hover{background:var(--vl)}
#narr{margin-top:14px;padding:14px 16px;background:var(--vl);border-radius:10px;
  font-size:15px;line-height:1.62;color:var(--ink);min-height:74px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#narr em{color:var(--mute)}
#hint{margin-top:10px;font-size:12px;color:var(--mute)}
@media(max-width:640px){#narr{font-size:14.5px}}
</style></head><body>
<div id="wrap">
  <div id="head"><h1>CHART</h1><span class="sub">Human-AI Complementarity</span></div>
  <div id="slidewrap"><div id="slidehost"></div></div>
  <div id="bar">
    <div id="nav"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button></div>
    <span id="count"></span>
    <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)" title="Jump to slide">
  </div>
  <div id="narr"></div>
  <div id="hint">Use arrow keys or space to advance.</div>
</div>
<script>
const FRAGS = {"1": "<div class=\"slide title\"><h2>CHART</h2><div class=\"meta\">Human-AI Complementarity</div></div>", "2": "<div class=\"slide\"><div class=\"kicker\">The idea</div><div class=\"rule\"></div><h2>Most teams describe how they work together and then hope.</h2><ul><li class=\"frag\">CHART writes it down as a graph and makes the software enforce it.</li><li class=\"frag\">CHART is a **Configurable Human-AI Research Testbed**.</li><li class=\"frag\">Existing platforms fix the team: CybORG and the CAGE challenges put the human outside the loop as an evaluator; the Team Defense Game brought the human in, but with one hard-wired coordination pattern.</li></ul></div>", "3": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>Two layers and a recorder</h2><p class=\"lead\">The inner layer is **taskwork interdependence**: a directed acyclic graph over teammates, human and AI, whose edges say who must coordinate with whom, under what condition, in what order.</p><p class=\"lead frag\">The outer layer is **teamwork modalities**: the interaction mechanisms through which that coordination actually happens — pre-task configuration, approval workflows, explanation panels, chat.</p><p class=\"lead frag\">Underneath both sits **data collection**, instrumenting every step with time-stamped traces.</p></div>", "4": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>Five dependency types</h2><p class=\"lead\">Nodes are agents and pools; edges are typed.</p><p class=\"lead frag\">Each type is a coordination pattern that shows up in real security operations.</p><p class=\"lead frag\">**Control** — an action requires authorization from another agent before it executes.</p></div>", "5": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>The modalities</h2><p class=\"lead\">**Pre-task configuration.** A lobby where teams assemble, roles are assigned, the AI teammate's capability profile is chosen, and the dependency graph is previewed before anyone starts.</p><p class=\"lead frag\">Either the experimenter sets it, or the participants do — which itself becomes a manipulation: how people react to an imposed structure versus one they wrote.</p><p class=\"lead frag\">**Approval.** Actions on `#control` edges enter a queue visible to their supervisor, who can grant, deny, or ask for an explanation.</p></div>", "6": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>What the traces are for</h2><p class=\"lead\">Data is organized along the Input–Process–Outcome cycle.</p><p class=\"lead frag\">Inputs: session setup, AI selection, graph configuration.</p><p class=\"lead frag\">Processes: approvals, explanation consultations, chat, execution under dependency checks.</p></div>", "7": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>Beyond cyber</h2><p class=\"lead\">Cybersecurity is the motivating case — tiered authority, compartmentalized access, decisions on a timescale where hesitation costs.</p><p class=\"lead frag\">But the design principles carry to any high-stakes interdependent domain: emergency response, healthcare, autonomous vehicle coordination.</p></div>"};
const NARR  = {"1": "Most teams describe how they work together and then hope. CHART writes it down as a graph and makes the software enforce it.\n\n\n\nCHART is a **Configurable Human-AI Research Testbed**. Existing platforms fix the team: CybORG and the CAGE challenges put the human outside the loop as an evaluator; the Team Defense Game brought the human in, but with one hard-wired coordination pattern. That makes it hard to ask the question that actually matters — whether a result about trust or workload survives a change in how the team is organised. CHART makes the structure of teamwork the independent variable.", "2": "Most teams describe how they work together and then hope. CHART writes it down as a graph and makes the software enforce it.\n\n\n\nCHART is a **Configurable Human-AI Research Testbed**. Existing platforms fix the team: CybORG and the CAGE challenges put the human outside the loop as an evaluator; the Team Defense Game brought the human in, but with one hard-wired coordination pattern. That makes it hard to ask the question that actually matters — whether a result about trust or workload survives a change in how the team is organised. CHART makes the structure of teamwork the independent variable.", "3": "The inner layer is **taskwork interdependence**: a directed acyclic graph over teammates, human and AI, whose edges say who must coordinate with whom, under what condition, in what order.\n\nThe outer layer is **teamwork modalities**: the interaction mechanisms through which that coordination actually happens — pre-task configuration, approval workflows, explanation panels, chat.\n\nUnderneath both sits **data collection**, instrumenting every step with time-stamped traces. Together they support controlled structure × interaction experiments with reproducible comparisons on quality, time, error and human load.", "4": "Nodes are agents and pools; edges are typed. Each type is a coordination pattern that shows up in real security operations.\n\n**Control** — an action requires authorization from another agent before it executes. Approval chains and escalation protocols: shutting down a production server, deploying a honeypot. Configurable with escalation chains, risk-tier gating, and a timeout policy that either auto-approves or auto-denies.\n\n**Pool** — contributions must reach a threshold before a composite action fires. Isolating an enterprise-wide subnet takes concurrence from two of three analysts. Configurable with contribution weights, sliding windows, k-of-n quorum, and reset policy.\n\n**Synchrony** — designated actions must occur in the same turn or window to take effect. Coordinated shutdowns to cut off lateral movement. Configurable with a tolerance window and precedence rules against other dependencies.\n\n**Temporal** — strict ordering. Forensic analysis before containment, so evidence survives; scanning before remediation. Configurable with validity windows, evidence requirements, and exception roles allowed to bypass.\n\n**Informational** — what one agent may see of another's observations. A junior analyst gets filtered alert logs; a senior responder integrates across sources. Configurable with redaction level, time-gated access, clearance conditions and event-triggered reveals.\n\nThe contribution is not the graph formalism. It's using the graph to vary authority distribution, information flow and sequencing across experiments, and then reading the effect on resilience, trust and performance.", "5": "**Pre-task configuration.** A lobby where teams assemble, roles are assigned, the AI teammate's capability profile is chosen, and the dependency graph is previewed before anyone starts. Either the experimenter sets it, or the participants do — which itself becomes a manipulation: how people react to an imposed structure versus one they wrote.\n\n**Approval.** Actions on `#control` edges enter a queue visible to their supervisor, who can grant, deny, or ask for an explanation. Vary which actions need approval, vary the escalation delay, and the trade-off becomes measurable: auto-approve for throughput, abort for safety. The point is to externalize the authority mechanism — agents do not reliably self-regulate, and humans should not have to improvise oversight mid-incident.\n\n**Explanation.** When the agent proposes an action, the panel shows a rationale: a short summary, a detailed view with links to the evidence. Humans can edit it as a decision tree or flowchart, adding and removing nodes, which steers the agent rather than just interrogating it. Consultation patterns are logged — how often, at what depth, and whether looking changed the approval.\n\n**Communication.** Public channel, private messages, @-mentions. The agent posts status and asks clarifying questions; the system posts key events automatically. Researchers can restrict visibility to simulate compartmentalization, cap message length, or inject misinformation to test robustness. Conversation becomes an empirical variable rather than an uncontrolled one.", "6": "Data is organized along the Input–Process–Outcome cycle. Inputs: session setup, AI selection, graph configuration. Processes: approvals, explanation consultations, chat, execution under dependency checks. Outcomes: mission results, trust and workload signals, and behaviour that feeds forward into the next mission.\n\nThe value is in the linking, not the individual streams. A single sequence — agent proposes isolation, human opens the explanation, asks a clarifying question in chat, modifies the proposal to quarantine instead, approves the revision, system checks that scanning already happened — arrives as one connected object. That supports questions isolated logs cannot answer: whether consulting an explanation improves approval quality, whether chat clarification reduces modification rates, whether trust calibrates differently under synchrony than under control.\n\nThe same traces double as training data. Approvals mark acceptable behaviour, denials mark boundaries, modifications identify the preferred alternative — structured preference data for RLHF. Explanation edits reveal how people structure causal reasoning. Configuration traces encode the authority boundaries an agent should be trained never to violate.\n\nScientific transparency comes first: reproducible, auditable logs, with learning layered on top as an optional consumer of the same data.", "7": "Cybersecurity is the motivating case — tiered authority, compartmentalized access, decisions on a timescale where hesitation costs. But the design principles carry to any high-stakes interdependent domain: emergency response, healthcare, autonomous vehicle coordination."};
const N = Object.keys(FRAGS).length;
let si = 1, cur = 0;
const host = document.getElementById('slidehost');
const narr = document.getElementById('narr');
const rng  = document.querySelector('#bar input');
function maxStep(){ return host.querySelectorAll('.frag').length; }
function md(t){
  return t.split(/\n\s*\n/).map(p =>
    '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
             .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/_(.+?)_/g,'<em>$1</em>') + '</p>').join('');
}
function render(){
  host.querySelectorAll('.frag').forEach((el,i)=> el.classList.toggle('on', i < cur));
  const M = maxStep();
  document.getElementById('count').textContent = 'slide ' + si + ' / ' + N + (si===N && cur>=M ? ' — end' : '');
  rng.max = N; rng.value = si;
  location.hash = si > 1 ? 's' + si : '';
}
function show(){ host.innerHTML = FRAGS[si]; narr.innerHTML = md(NARR[si] || ''); render(); }
function jump(n){ si = Math.min(Math.max(1,n), N); cur = 0; show(); }
function step(d){
  const M = maxStep();
  if (d > 0){ if (cur < M){ cur++; render(); } else if (si < N){ si++; cur = 0; show(); } }
  else { if (cur > 0){ cur--; render(); } else if (si > 1){ si--; show(); cur = maxStep(); render(); } }
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
});
function fromHash(){ const m = location.hash.match(/^#s(\d+)$/); if (m){ si = Math.min(Math.max(1,+m[1]),N); cur = 0; show(); } }
window.addEventListener('hashchange', fromHash);
document.getElementById('slidewrap').addEventListener('click', () => step(1));
// GitBook webframe handshake
function post(a){ if (window.parent !== window) window.parent.postMessage(a, '*'); }
post({action:'@webframe.ready'});
function sizeUp(){ post({action:'@webframe.resize', aspectRatio: 16/9, maxHeight: 900,
  size:{height: document.getElementById('wrap').scrollHeight}}); }
new ResizeObserver(sizeUp).observe(document.getElementById('wrap'));
fromHash(); show(); sizeUp();
</script></body></html>
