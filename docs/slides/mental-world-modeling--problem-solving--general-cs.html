
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>General CS Problem-Solving — slides</title>
<meta property="og:title" content="General CS Problem-Solving">
<meta property="og:description" content="Mental World Modeling">
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280;--och:#a8843c;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
#head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
#head h1{font-size:17px;margin:0;color:var(--d);font-weight:650}
#head .sub{font-size:12.5px;color:var(--mute)}
#slidewrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--l);
  border-radius:10px;overflow:hidden;background:#fff;container-type:size}
.slide{position:absolute;inset:0;padding:5.2cqw 6cqw;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:var(--d);color:#fff;justify-content:center}
.slide.title h2{font-size:6.4cqw;line-height:1.12;margin:0 0 2.4cqh;font-weight:650}
.slide.title .meta{font-size:2.6cqw;color:var(--l)}
.slide h2{font-size:4.4cqw;line-height:1.15;margin:0 0 3.2cqh;color:var(--d);font-weight:650}
.slide .kicker{font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--och);margin-bottom:1.6cqh}
.slide ul{margin:0;padding-left:3.4cqw}
.slide li{font-size:2.9cqw;line-height:1.5;margin-bottom:1.7cqh;color:var(--ink)}
.slide p.lead{font-size:3.1cqw;line-height:1.45;margin:0;color:var(--ink)}
.slide .rule{height:.5cqh;background:var(--l);width:14cqw;margin-bottom:2.6cqh;border-radius:2px}
.frag{opacity:.16;transition:opacity .18s}
.frag.on{opacity:1}
#bar{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-size:12.5px;color:var(--mute)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#nav{display:flex;gap:8px}
#nav button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
  border-radius:7px;padding:4px 11px;cursor:pointer}
#nav button:hover{background:var(--vl)}
#narr{margin-top:14px;padding:14px 16px;background:var(--vl);border-radius:10px;
  font-size:15px;line-height:1.62;color:var(--ink);min-height:74px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#narr em{color:var(--mute)}
#hint{margin-top:10px;font-size:12px;color:var(--mute)}
@media(max-width:640px){#narr{font-size:14.5px}}
</style></head><body>
<div id="wrap">
  <div id="head"><h1>General CS Problem-Solving</h1><span class="sub">Mental World Modeling</span></div>
  <div id="slidewrap"><div id="slidehost"></div></div>
  <div id="bar">
    <div id="nav"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button></div>
    <span id="count"></span>
    <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)" title="Jump to slide">
  </div>
  <div id="narr"></div>
  <div id="hint">Use arrow keys or space to advance.</div>
</div>
<script>
const FRAGS = {"1": "<div class=\"slide title\"><h2>General CS Problem-Solving</h2><div class=\"meta\">Mental World Modeling</div></div>", "2": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>Solving as a graph</h2><p class=\"lead\">A session isn't a list.</p><p class=\"lead frag\">Reading the spec spawns two things at once — a plan to split the problem into cases, and the memory of a similar bug.</p><p class=\"lead frag\">The plan spawns two pieces of implementation.</p></div>", "3": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>The question</h2><p class=\"lead\">When someone works through a computing problem, what are they doing at each moment?</p><p class=\"lead frag\">Reading, decomposing, recalling something they've seen before, planning, implementing, testing, revising.</p><p class=\"lead frag\">Naming those operations is easy.</p></div>", "4": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>Can observers agree on it</h2><p class=\"lead\">Three coders labelling the same session, segment by segment, with the consensus track underneath.</p><p class=\"lead frag\">Where all three agree, the consensus block is solid and outlined.</p><p class=\"lead frag\">Where they don't, it fades.</p></div>", "5": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>The instrument</h2><p class=\"lead\">The coding in that animation is not done by hand on paper.</p><p class=\"lead frag\">It runs in **Astrolabe**, a local research app built for this work.</p><p class=\"lead frag\">Astrolabe takes in transcripts — typed, uploaded, or recorded in the browser and transcribed with Whisper — and lets multiple annotators code the same session against a shared scheme.</p></div>", "6": "<div class=\"slide\"><div class=\"kicker\">Mental World Modeling</div><div class=\"rule\"></div><h2>Where it connects</h2><p class=\"lead\">This is the layer underneath the tooling.</p><p class=\"lead frag\">If mental operations can be identified reliably, then a system that watches a work session can say something useful about _where_ someone is stuck rather than only that they are — which is what the assistive side of the work needs in order to be more than a faster autocomplete.</p></div>"};
const NARR  = {"1": "General CS Problem-Solving", "2": "A session isn't a list. Reading the spec spawns two things at once — a plan to split the problem into cases, and the memory of a similar bug. The plan spawns two pieces of implementation. Running the tests produces a failure, the failure produces a hypothesis, and the hypothesis produces both a patch and a note about the pattern that will outlive this problem.\n\nDrawn this way, the shape of the solve is visible: where it branched, where it looped back, and which step turned out to be the hinge.", "3": "When someone works through a computing problem, what are they doing at each moment? Reading, decomposing, recalling something they've seen before, planning, implementing, testing, revising.\n\nNaming those operations is easy. Getting independent observers to agree on where one ends and the next begins is not, and that agreement is the whole ballgame — a construct nobody can code reliably isn't a construct.", "4": "Three coders labelling the same session, segment by segment, with the consensus track underneath. Where all three agree, the consensus block is solid and outlined. Where they don't, it fades.\n\nThe running agreement figure is deliberately not flattering. Disagreement is treated as the finding rather than the noise: the segments where coders split are the segments where the operation genuinely is ambiguous, and those are worth studying rather than smoothing away.", "5": "The coding in that animation is not done by hand on paper. It runs in **Astrolabe**, a local research app built for this work.\n\nAstrolabe takes in transcripts — typed, uploaded, or recorded in the browser and transcribed with Whisper — and lets multiple annotators code the same session against a shared scheme. It then reports stage-level percent agreement and Cohen's kappa between coders, and exports the agreement report and the full annotation bundle for downstream analysis.\n\nIt also carries the question-card structure the project is organised around, with hypergraph overlays for grouping operations at different scales, and reusable prompt scaffolds when a language model is used to propose candidate operations or concepts.\n\nTwo design commitments worth naming: it runs entirely on the researcher's own machine, nothing hosted; and it never writes to the source material. It reads a snapshot, keeps all app state in its own database, and hands changes back as text you paste yourself.", "6": "This is the layer underneath the tooling. If mental operations can be identified reliably, then a system that watches a work session can say something useful about _where_ someone is stuck rather than only that they are — which is what the assistive side of the work needs in order to be more than a faster autocomplete."};
const N = Object.keys(FRAGS).length;
let si = 1, cur = 0;
const host = document.getElementById('slidehost');
const narr = document.getElementById('narr');
const rng  = document.querySelector('#bar input');
function maxStep(){ return host.querySelectorAll('.frag').length; }
function md(t){
  return t.split(/\n\s*\n/).map(p =>
    '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
             .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/_(.+?)_/g,'<em>$1</em>') + '</p>').join('');
}
function render(){
  host.querySelectorAll('.frag').forEach((el,i)=> el.classList.toggle('on', i < cur));
  const M = maxStep();
  document.getElementById('count').textContent = 'slide ' + si + ' / ' + N + (si===N && cur>=M ? ' — end' : '');
  rng.max = N; rng.value = si;
  location.hash = si > 1 ? 's' + si : '';
}
function show(){ host.innerHTML = FRAGS[si]; narr.innerHTML = md(NARR[si] || ''); render(); }
function jump(n){ si = Math.min(Math.max(1,n), N); cur = 0; show(); }
function step(d){
  const M = maxStep();
  if (d > 0){ if (cur < M){ cur++; render(); } else if (si < N){ si++; cur = 0; show(); } }
  else { if (cur > 0){ cur--; render(); } else if (si > 1){ si--; show(); cur = maxStep(); render(); } }
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
});
function fromHash(){ const m = location.hash.match(/^#s(\d+)$/); if (m){ si = Math.min(Math.max(1,+m[1]),N); cur = 0; show(); } }
window.addEventListener('hashchange', fromHash);
document.getElementById('slidewrap').addEventListener('click', () => step(1));
// GitBook webframe handshake
function post(a){ if (window.parent !== window) window.parent.postMessage(a, '*'); }
post({action:'@webframe.ready'});
function sizeUp(){ post({action:'@webframe.resize', aspectRatio: 16/9, maxHeight: 900,
  size:{height: document.getElementById('wrap').scrollHeight}}); }
new ResizeObserver(sizeUp).observe(document.getElementById('wrap'));
fromHash(); show(); sizeUp();
</script></body></html>
