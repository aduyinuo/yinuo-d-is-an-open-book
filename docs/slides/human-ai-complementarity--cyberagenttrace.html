
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberAgentFlow — slides</title>
<meta property="og:title" content="CyberAgentFlow">
<meta property="og:description" content="Human-AI Complementarity">
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280;--och:#a8843c;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
#head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
#head h1{font-size:17px;margin:0;color:var(--d);font-weight:650}
#head .sub{font-size:12.5px;color:var(--mute)}
#slidewrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--l);
  border-radius:10px;overflow:hidden;background:#fff;container-type:size}
.slide{position:absolute;inset:0;padding:5.2cqw 6cqw;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:var(--d);color:#fff;justify-content:center}
.slide.title h2{font-size:6.4cqw;line-height:1.12;margin:0 0 2.4cqh;font-weight:650}
.slide.title .meta{font-size:2.6cqw;color:var(--l)}
.slide h2{font-size:4.4cqw;line-height:1.15;margin:0 0 3.2cqh;color:var(--d);font-weight:650}
.slide .kicker{font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--och);margin-bottom:1.6cqh}
.slide ul{margin:0;padding-left:3.4cqw}
.slide li{font-size:2.9cqw;line-height:1.5;margin-bottom:1.7cqh;color:var(--ink)}
.slide p.lead{font-size:3.1cqw;line-height:1.45;margin:0;color:var(--ink)}
.slide .rule{height:.5cqh;background:var(--l);width:14cqw;margin-bottom:2.6cqh;border-radius:2px}
.frag{opacity:.16;transition:opacity .18s}
.frag.on{opacity:1}
#bar{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-size:12.5px;color:var(--mute)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#nav{display:flex;gap:8px}
#nav button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
  border-radius:7px;padding:4px 11px;cursor:pointer}
#nav button:hover{background:var(--vl)}
#narr{margin-top:14px;padding:14px 16px;background:var(--vl);border-radius:10px;
  font-size:15px;line-height:1.62;color:var(--ink);min-height:74px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#narr em{color:var(--mute)}
#hint{margin-top:10px;font-size:12px;color:var(--mute)}
@media(max-width:640px){#narr{font-size:14.5px}}
</style></head><body>
<div id="wrap">
  <div id="head"><h1>CyberAgentFlow</h1><span class="sub">Human-AI Complementarity</span></div>
  <div id="slidewrap"><div id="slidehost"></div></div>
  <div id="bar">
    <div id="nav"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button></div>
    <span id="count"></span>
    <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)" title="Jump to slide">
  </div>
  <div id="narr"></div>
  <div id="hint">Use arrow keys or space to advance.</div>
</div>
<script>
const FRAGS = {"1": "<div class=\"slide title\"><h2>CyberAgentFlow</h2><div class=\"meta\">Human-AI Complementarity</div></div>", "2": "<div class=\"slide\"><div class=\"kicker\">The idea</div><div class=\"rule\"></div><h2>Most evaluations of agentic cyber tools ask whether the task got done.</h2><ul><li class=\"frag\">That tells you almost nothing about how it got done, or what it cost.</li></ul></div>", "3": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>What gets recorded</h2><p class=\"lead\">Cyber-Agent-Flow instruments the whole interaction lifecycle of an agent-driven engagement: prompts, model responses, tool invocations, command outputs, analyst annotations, and timing.</p><p class=\"lead frag\">Sessions are archived as structured execution traces, and an analysis model inspects them afterwards for inefficiency.</p><p class=\"lead frag\">The stack runs locally.</p></div>", "4": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>What it found</h2><p class=\"lead\">The scenario is a pivot.</p><p class=\"lead frag\">The agent starts on an externally reachable host, works through reconnaissance and service identification, exploits a vulnerable web server, and uses it to route into an internal server it could not reach directly.</p><p class=\"lead frag\">It completed the task.</p></div>", "5": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>The failure patterns</h2><p class=\"lead\">Five recurring ones, visible only because the trace existed: **Redundant tool invocations** — the same reconnaissance command run again with unchanged parameters, when the earlier result was still valid.</p><p class=\"lead frag\">**Command-context confusion** — commands written for the system shell issued inside Metasploit, or Meterpreter commands issued outside a session.</p><p class=\"lead frag\">Sometimes hallucinated outright, sometimes correct for a different tool version.</p></div>", "6": "<div class=\"slide\"><div class=\"kicker\">Human-AI Complementarity</div><div class=\"rule\"></div><h2>Why this matters</h2><p class=\"lead\">The lesson is not that the agent is bad at reasoning.</p><p class=\"lead frag\">It reached the objective.</p><p class=\"lead frag\">The lesson is that orchestrating the tools it already has may matter as much as choosing them well — and that you cannot see any of this from a success rate.</p></div>"};
const NARR  = {"1": "Most evaluations of agentic cyber tools ask whether the task got done. That tells you almost nothing about how it got done, or what it cost.", "2": "Most evaluations of agentic cyber tools ask whether the task got done. That tells you almost nothing about how it got done, or what it cost.", "3": "Cyber-Agent-Flow instruments the whole interaction lifecycle of an agent-driven engagement: prompts, model responses, tool invocations, command outputs, analyst annotations, and timing. Sessions are archived as structured execution traces, and an analysis model inspects them afterwards for inefficiency.\n\nThe stack runs locally. Tools are exposed through Model Context Protocol interfaces — Kali utilities like nmap and Metasploit behind an MCP server — with the language model hosted privately through Ollama and a LiteLLM gateway handling routing and access control. That's a deliberate choice: cloud-hosted agents send prompts and network telemetry off-site, which is not acceptable on a real engagement.\n\nThe analyst stays in the loop through a web interface: issuing objectives in natural language, watching actions as they happen, annotating throughout, and constraining what the agent may touch through tool permissions and IP allowlists. Long engagements are handled with a context budget that summarises older history while keeping recent exchanges intact.", "4": "The scenario is a pivot. The agent starts on an externally reachable host, works through reconnaissance and service identification, exploits a vulnerable web server, and uses it to route into an internal server it could not reach directly.\n\nIt completed the task. The interesting part is where the time went — exploit selection, exploit attempts, and pivot setup dominated. Reaching the pivot took roughly **50 minutes**. With the identified waste removed, the estimated time is roughly **11 minutes**.", "5": "Five recurring ones, visible only because the trace existed:\n\n**Redundant tool invocations** — the same reconnaissance command run again with unchanged parameters, when the earlier result was still valid.\n\n**Command-context confusion** — commands written for the system shell issued inside Metasploit, or Meterpreter commands issued outside a session. Sometimes hallucinated outright, sometimes correct for a different tool version.\n\n**Exploit retry loops** — module after module tried with minimal parameter changes, without folding in what the previous failure revealed.\n\n**Environment constraint violations** — commands assuming shell features or permissions the environment doesn't offer.\n\n**Pivot configuration complexity** — routing requires coordinating Meterpreter session commands with Metasploit modules, and the agent struggles to keep straight which command belongs to which.", "6": "The lesson is not that the agent is bad at reasoning. It reached the objective. The lesson is that orchestrating the tools it already has may matter as much as choosing them well — and that you cannot see any of this from a success rate.\n\n_Observations come from a single run. They illustrate common failure modes rather than establishing their frequency._"};
const N = Object.keys(FRAGS).length;
let si = 1, cur = 0;
const host = document.getElementById('slidehost');
const narr = document.getElementById('narr');
const rng  = document.querySelector('#bar input');
function maxStep(){ return host.querySelectorAll('.frag').length; }
function md(t){
  return t.split(/\n\s*\n/).map(p =>
    '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
             .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/_(.+?)_/g,'<em>$1</em>') + '</p>').join('');
}
function render(){
  host.querySelectorAll('.frag').forEach((el,i)=> el.classList.toggle('on', i < cur));
  const M = maxStep();
  document.getElementById('count').textContent = 'slide ' + si + ' / ' + N + (si===N && cur>=M ? ' — end' : '');
  rng.max = N; rng.value = si;
  location.hash = si > 1 ? 's' + si : '';
}
function show(){ host.innerHTML = FRAGS[si]; narr.innerHTML = md(NARR[si] || ''); render(); }
function jump(n){ si = Math.min(Math.max(1,n), N); cur = 0; show(); }
function step(d){
  const M = maxStep();
  if (d > 0){ if (cur < M){ cur++; render(); } else if (si < N){ si++; cur = 0; show(); } }
  else { if (cur > 0){ cur--; render(); } else if (si > 1){ si--; show(); cur = maxStep(); render(); } }
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
});
function fromHash(){ const m = location.hash.match(/^#s(\d+)$/); if (m){ si = Math.min(Math.max(1,+m[1]),N); cur = 0; show(); } }
window.addEventListener('hashchange', fromHash);
document.getElementById('slidewrap').addEventListener('click', () => step(1));
// GitBook webframe handshake
function post(a){ if (window.parent !== window) window.parent.postMessage(a, '*'); }
post({action:'@webframe.ready'});
function sizeUp(){ post({action:'@webframe.resize', aspectRatio: 16/9, maxHeight: 900,
  size:{height: document.getElementById('wrap').scrollHeight}}); }
new ResizeObserver(sizeUp).observe(document.getElementById('wrap'));
fromHash(); show(); sizeUp();
</script></body></html>
