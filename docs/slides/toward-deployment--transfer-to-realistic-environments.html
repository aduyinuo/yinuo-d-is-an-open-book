
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sim2Sim before Sim2Real — slides</title>
<meta property="og:title" content="Sim2Sim before Sim2Real">
<meta property="og:description" content="Toward Deployment">
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280;--och:#a8843c;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:980px;margin:0 auto;padding:14px 16px 28px}
#head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
#head h1{font-size:17px;margin:0;color:var(--d);font-weight:650}
#head .sub{font-size:12.5px;color:var(--mute)}
#slidewrap{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--l);
  border-radius:10px;overflow:hidden;background:#fff;container-type:size}
.slide{position:absolute;inset:0;padding:5.2cqw 6cqw;display:flex;flex-direction:column;justify-content:center}
.slide.title{background:var(--d);color:#fff;justify-content:center}
.slide.title h2{font-size:6.4cqw;line-height:1.12;margin:0 0 2.4cqh;font-weight:650}
.slide.title .meta{font-size:2.6cqw;color:var(--l)}
.slide h2{font-size:4.4cqw;line-height:1.15;margin:0 0 3.2cqh;color:var(--d);font-weight:650}
.slide .kicker{font-size:2.1cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--och);margin-bottom:1.6cqh}
.slide ul{margin:0;padding-left:3.4cqw}
.slide li{font-size:2.9cqw;line-height:1.5;margin-bottom:1.7cqh;color:var(--ink)}
.slide p.lead{font-size:3.1cqw;line-height:1.45;margin:0;color:var(--ink)}
.slide .rule{height:.5cqh;background:var(--l);width:14cqw;margin-bottom:2.6cqh;border-radius:2px}
.frag{opacity:.16;transition:opacity .18s}
.frag.on{opacity:1}
#bar{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-size:12.5px;color:var(--mute)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#nav{display:flex;gap:8px}
#nav button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
  border-radius:7px;padding:4px 11px;cursor:pointer}
#nav button:hover{background:var(--vl)}
#narr{margin-top:14px;padding:14px 16px;background:var(--vl);border-radius:10px;
  font-size:15px;line-height:1.62;color:var(--ink);min-height:74px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#narr em{color:var(--mute)}
#hint{margin-top:10px;font-size:12px;color:var(--mute)}
@media(max-width:640px){#narr{font-size:14.5px}}
</style></head><body>
<div id="wrap">
  <div id="head"><h1>Sim2Sim before Sim2Real</h1><span class="sub">Toward Deployment</span></div>
  <div id="slidewrap"><div id="slidehost"></div></div>
  <div id="bar">
    <div id="nav"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button></div>
    <span id="count"></span>
    <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)" title="Jump to slide">
  </div>
  <div id="narr"></div>
  <div id="hint">Use arrow keys or space to advance.</div>
</div>
<script>
const FRAGS = {"1": "<div class=\"slide title\"><h2>Sim2Sim before Sim2Real</h2><div class=\"meta\">Toward Deployment</div></div>", "2": "<div class=\"slide\"><div class=\"kicker\">The idea</div><div class=\"rule\"></div><h2>An agent that learns to attack or defend a network learns it _somewhere_.</h2><ul><li class=\"frag\">That somewhere is a simulator, because letting a learning agent explore production infrastructure by trial and error is not an option.</li><li class=\"frag\">The question this line of work asks is what happens next.</li></ul></div>", "3": "<div class=\"slide\"><div class=\"kicker\">Toward Deployment</div><div class=\"rule\"></div><h2>The problem</h2><ul><li class=\"frag\">An organization trains a red-teaming agent in simulation and wants to run it against its own network.</li><li class=\"frag\">An organization wants to compare its agent against one trained in a different simulator.</li></ul></div>", "4": "<div class=\"slide\"><div class=\"kicker\">Toward Deployment</div><div class=\"rule\"></div><h2>The approach</h2><p class=\"lead\">Split transfer into two mappings and build each without touching the underlying simulators.</p><p class=\"lead frag\">**Action translation.** A shared, deterministic action vocabulary in which each action advances a chosen host along the kill chain.</p><p class=\"lead frag\">Wrapper logic resolves the choice into whatever the target simulator natively expects.</p></div>", "5": "<div class=\"slide\"><div class=\"kicker\">Toward Deployment</div><div class=\"rule\"></div><h2>Questions being asked</h2><p class=\"lead\">1.</p><p class=\"lead frag\">Can offensive cyber policies transfer zero-shot across environments, with no retraining?</p><p class=\"lead frag\">2.</p></div>", "6": "<div class=\"slide\"><div class=\"kicker\">Toward Deployment</div><div class=\"rule\"></div><h2>Where it runs</h2><p class=\"lead\">Evaluated across CyberWheel as the source, with NetSecGame and CyberBattleSim as targets at different distances from it, and NASim's emulation mode — Docker containers, live services, real exploit execution — as a proxy for deployment.</p><p class=\"lead frag\">**Related:** Toward Deployment | Training in Realistic Environments | Cyber Environments &amp; Benchmarks</p></div>"};
const NARR  = {"1": "An agent that learns to attack or defend a network learns it _somewhere_. That somewhere is a simulator, because letting a learning agent explore production infrastructure by trial and error is not an option. The question this line of work asks is what happens next.", "2": "An agent that learns to attack or defend a network learns it _somewhere_. That somewhere is a simulator, because letting a learning agent explore production infrastructure by trial and error is not an option. The question this line of work asks is what happens next.", "3": "A policy trained in simulator A cannot simply be run in simulator B. The two describe the world differently: different state spaces, different action vocabularies, different assumptions about what the agent can see. Formally, given environments with state and action spaces that do not coincide, can a policy trained to competence in one be executed in the other without retraining?\n\nThis shows up in two places that look separate but are not:\n\n* An organization trains a red-teaming agent in simulation and wants to run it against its own network.\n\n* An organization wants to compare its agent against one trained in a different simulator.\n\nBoth reduce to the same thing — aligning policies across environments that speak different representations. Sim-to-real is the same problem as sim-to-sim, with one extra difficulty: the target is only partially known. Supplying the missing ground truth would collapse it back to sim-to-sim, which is still hard; finding the abstraction that relates two fully specified environments is itself computationally difficult.", "4": "Split transfer into two mappings and build each without touching the underlying simulators.\n\n**Action translation.** A shared, deterministic action vocabulary in which each action advances a chosen host along the kill chain. Wrapper logic resolves the choice into whatever the target simulator natively expects. The policy's intent — which host to move on next — is decoupled from the mechanics of expressing it.\n\n**State alignment.** Each raw observation is projected into a fixed-size vector organized by kill-chain stage per host: phase, reachability, attacker presence, target designation, plus a small block of episode-level context. This is computed deterministically per environment, with nothing learned.\n\nThat handles structural mismatch but leaves a distributional gap — the same feature carries different numbers across simulators, because networks differ in size, discovery rates, and reward scales. A lightweight encoder closes it, trained with adversarial domain confusion so a discriminator cannot tell which simulator an observation came from, with reconstruction to stop the encoder collapsing everything to one point, and a mean-alignment term to steady early training.\n\nOne detail that turned out to matter: features that mean the same thing in both environments — the flags identifying the goal — bypass the encoder entirely. Routing them through adversarial alignment suppresses the goal signal and the agent stops behaving goal-directedly.\n\nEncoder pretraining needs only observations from a random policy in each environment. No trajectories, no rewards from the target.", "5": "1. Can offensive cyber policies transfer zero-shot across environments, with no retraining?\n\n2. Which parts of a policy actually transfer — the state understanding, the action selection, or neither?\n\n3. Does transfer survive when the target is only partially observable, as in emulation or a live deployment?", "6": "Evaluated across CyberWheel as the source, with NetSecGame and CyberBattleSim as targets at different distances from it, and NASim's emulation mode — Docker containers, live services, real exploit execution — as a proxy for deployment.\n\n**Related:** Toward Deployment | Training in Realistic Environments | Cyber Environments & Benchmarks"};
const N = Object.keys(FRAGS).length;
let si = 1, cur = 0;
const host = document.getElementById('slidehost');
const narr = document.getElementById('narr');
const rng  = document.querySelector('#bar input');
function maxStep(){ return host.querySelectorAll('.frag').length; }
function md(t){
  return t.split(/\n\s*\n/).map(p =>
    '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
             .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/_(.+?)_/g,'<em>$1</em>') + '</p>').join('');
}
function render(){
  host.querySelectorAll('.frag').forEach((el,i)=> el.classList.toggle('on', i < cur));
  const M = maxStep();
  document.getElementById('count').textContent = 'slide ' + si + ' / ' + N + (si===N && cur>=M ? ' — end' : '');
  rng.max = N; rng.value = si;
  location.hash = si > 1 ? 's' + si : '';
}
function show(){ host.innerHTML = FRAGS[si]; narr.innerHTML = md(NARR[si] || ''); render(); }
function jump(n){ si = Math.min(Math.max(1,n), N); cur = 0; show(); }
function step(d){
  const M = maxStep();
  if (d > 0){ if (cur < M){ cur++; render(); } else if (si < N){ si++; cur = 0; show(); } }
  else { if (cur > 0){ cur--; render(); } else if (si > 1){ si--; show(); cur = maxStep(); render(); } }
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
});
function fromHash(){ const m = location.hash.match(/^#s(\d+)$/); if (m){ si = Math.min(Math.max(1,+m[1]),N); cur = 0; show(); } }
window.addEventListener('hashchange', fromHash);
document.getElementById('slidewrap').addEventListener('click', () => step(1));
// GitBook webframe handshake
function post(a){ if (window.parent !== window) window.parent.postMessage(a, '*'); }
post({action:'@webframe.ready'});
function sizeUp(){ post({action:'@webframe.resize', aspectRatio: 16/9, maxHeight: 900,
  size:{height: document.getElementById('wrap').scrollHeight}}); }
new ResizeObserver(sizeUp).observe(document.getElementById('wrap'));
fromHash(); show(); sizeUp();
</script></body></html>
