name: Refresh the activity board

on:
  push:
    branches: [main]
    paths:
      - 'internal/activity/activity.json'
      - 'internal/activity/projects.json'
      - 'internal/activity/render_board.py'
      - 'internal/activity/heatmap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib pillow
      - name: Re-render the heatmaps and the page
        working-directory: internal/activity
        run: python render_board.py
      - name: Commit the refreshed board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/.gitbook/assets/activity-heatmap.png \
                  content/.gitbook/assets/heat-*.png \
                  content/personal/what-is-she-up-to.md
          git diff --staged --quiet || git commit -m "Refresh the activity board"
          git push
