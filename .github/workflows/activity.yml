name: Refresh the activity board

on:
  schedule:
    - cron: '30 11 * * *'      # every day, 05:30 in El Paso
  push:
    branches: [main]
    paths:
      - 'internal/activity/activity.json'
      - 'internal/activity/projects.json'
      - 'internal/activity/render_board.py'
      - 'internal/activity/heatmap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib pillow certifi
      - name: Pull the day's logged time
        # The research folders live on a drive only Max's machine can see, so a
        # scheduled run refreshes the Clockify half and leaves the folder scan
        # as the last full collection found it.
        if: github.event_name != 'push' && env.CLOCKIFY_KEY != ''
        env:
          CLOCKIFY_KEY: ${{ secrets.CLOCKIFY_KEY }}
        working-directory: internal/activity
        run: |
          printf '{"clockify_key": "%s"}' "$CLOCKIFY_KEY" > secrets.json
          python summarize_changes.py || true
          python collect_activity.py --clockify-only || true
          rm -f secrets.json clockify.json
      - name: Re-render the heatmaps and the page
        working-directory: internal/activity
        run: python render_board.py
      - name: Commit the refreshed board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/.gitbook/assets/activity-heatmap*.png \
                  content/.gitbook/assets/heat-*.png \
                  content/home/what-is-she-up-to.md \
                  internal/activity/activity.json
          git diff --staged --quiet || git commit -m "Refresh the activity board"
          git push
