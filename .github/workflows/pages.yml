name: Build slide decks and publish them

# Pages for this repo serves the gh-pages branch (an MkDocs site).
# This workflow converts the PowerPoint decks in slides-source/ and copies the
# result into gh-pages under /slides/, leaving the rest of that site untouched.

on:
  push:
    branches: [main]
    paths:
      - 'slides-source/**'
      - 'docs/slides/**'
      - 'internal/slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-slides
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert decks
        run: |
          pip install python-pptx pillow pymupdf
          python internal/slides/pptx_to_deck.py || true

          # A deck with a LaTeX build is published from that PDF instead.
          # pptx_to_deck rebuilds each slide from PowerPoint shapes, which
          # silently drops any diagram PowerPoint drew from its own shapes;
          # rendering the compiled PDF cannot lose anything. This runs
          # second on purpose, so it overwrites the pptx-derived page.
          for pdf in slides-source/*-latex/*.pdf; do
            [ -e "$pdf" ] || continue
            slug=$(basename "$pdf" .pdf)
            notes="slides-source/$slug.pptx"
            if [ -e "$notes" ]; then
              python internal/slides/pdf_to_deck.py "$pdf" --slug "$slug" --notes "$notes"
            else
              python internal/slides/pdf_to_deck.py "$pdf" --slug "$slug"
            fi
          done

          python internal/slides/make_index.py

      - name: Publish decks into gh-pages/slides
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/slides
          destination_dir: slides
          keep_files: true
          commit_message: 'Publish slide decks'
