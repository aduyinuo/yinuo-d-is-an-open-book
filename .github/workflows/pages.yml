name: Build slide decks and publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'slides-source/**'
      - 'docs/**'
      - 'internal/slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert PowerPoint decks to annotated slide pages
        run: |
          pip install python-pptx
          python internal/slides/pptx_to_deck.py || true

      - name: Build the deck index
        run: python internal/slides/make_index.py

      # enablement: true switches GitHub Pages on through the API using the
      # workflow token, so there is no setting to change by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
