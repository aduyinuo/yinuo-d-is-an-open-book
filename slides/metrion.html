43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">and fails against the real service.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">PenGym reports the same simulation-to-reality gap.</span></p></div></div>", "4": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Feature lists do not tell you what a claim needs</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:34.667%;width:90.752%;height:42.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.54cqw;color:#1F2430\">Hosts, vulnerabilities, services, actions — none of these say whether the environment supports the claim being made.</span></p></div></div>", "5": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">So ask a different question</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:34.667%;width:90.752%;height:42.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.54cqw;color:#1F2430\">Not: is this environment realistic?\nBut: does it have the realism the objective requires?</span></p></div></div>", "6": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:7.500%;top:41.333%;width:84.752%;height:21.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.79cqw;font-weight:650;color:#22452F\">How the framework is built</span></p></div></div>", "7": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Derive requirements from what techniques need</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:29.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Walk ATT&amp;CK and D3FEND technique by technique.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Record what each needs the environment to provide, model, or emit.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Cluster into eleven realism dimensions.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:71.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">115 concrete scoring elements underneath them.</span></p></div></div>", "8": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Eleven dimensions, in five groups</span></p></div><div class=\"shp txt\" style=\"left:14.250%;top:52.000%;width:71.252%;height:10.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:right;margin-left:0.0cqw\"><span style=\"font-size:2.71cqw;color:#A8843C\">[ Table 1 — dimensions grouped by what they affect ]</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:84.667%;width:90.752%;height:10.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.08cqw;color:#6B7280\">Infrastructure · organizational behavior · security layer · agent interface · external context</span></p></div></div>", "9": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Then mark the objective, and grade the environment</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:29.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Each element: critical, useful, or not needed.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Each environment: full, partial, absent, or unknown.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Weights 2 and 1; coverage 1, 0.5, 0.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:71.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Fit score is the weighted average.</span></p></div></div>", "10": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">One rule overrides the score</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:34.667%;width:90.752%;height:42.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.54cqw;color:#1F2430\">A single missing critical property invalidates the evaluation, whatever the average says.</span></p></div></div>", "11": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:7.500%;top:41.333%;width:84.752%;height:21.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.79cqw;font-weight:650;color:#22452F\">A worked example: GOAD, twice</span></p></div></div>", "12": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">GOAD, unchanged, judged against two objectives</span></p></div><div class=\"shp txt\" style=\"left:14.250%;top:52.000%;width:71.252%;height:10.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:right;margin-left:0.0cqw\"><span style=\"font-size:2.71cqw;color:#A8843C\">[ Figure 2 — GOAD radars, both use cases ]</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:84.667%;width:90.752%;height:10.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.08cqw;color:#6B7280\">Dashed polygon: what the objective requires. Solid polygon: what GOAD covers.</span></p></div></div>", "13": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Same environment, opposite verdicts</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:28.667%;width:42.001%;height:9.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.71cqw;font-weight:650;color:#4A7C59\">Credential privilege escalation</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:40.000%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· Critical: service, OS, identity, action, observation</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:53.333%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· GOAD covers all five fully</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:66.667%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· Fit 0.88 — suitable</span></p></div><div class=\"shp txt\" style=\"left:52.501%;top:28.667%;width:42.001%;height:9.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.71cqw;font-weight:650;color:#A8843C\">Targeted data exfiltration</span></p></div><div class=\"shp txt\" style=\"left:52.501%;top:40.000%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· Critical also: temporal, defensive, benign, telemetry, external</span></p></div><div class=\"shp txt\" style=\"left:52.501%;top:53.333%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· GOAD absent on all five</span></p></div><div class=\"shp txt\" style=\"left:52.501%;top:66.667%;width:42.001%;height:14.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:2.50cqw;color:#1F2430\">· Fit 0.39 — not suitable</span></p></div></div>", "14": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">What this makes visible</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:34.667%;width:90.752%;height:42.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.54cqw;color:#1F2430\">Environment limitations stop being a matter of taste and become a list of unmet requirements.</span></p></div></div>", "15": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">What is preliminary, said plainly</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:29.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Dimension-level proxy grades, not element-level scoring.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Thirteen environments, first-pass reading, not validated.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">ATT&amp;CK and D3FEND are themselves curated abstractions.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:71.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Enterprise IT matrix only.</span></p></div></div>", "16": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Validation is interviews, then a survey</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:29.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Practitioners in offensive, defensive, and environment-building roles.</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Which dimensions to add, remove, split, or merge?</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Do they agree on importance for a given objective?</span></p></div></div>", "17": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Three questions I would like your help with</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:29.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Are eleven dimensions and 115 elements the right granularity?</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:43.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Does critical / useful / not needed capture what an objective needs?</span></p></div><div class=\"shp txt\" style=\"left:7.500%;top:57.333%;width:87.752%;height:13.333%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.12cqw;color:#1F2430\">Is deriving from ATT&amp;CK and D3FEND a sound basis?</span></p></div></div>", "18": "<div class=\"slide\"><div class=\"shp txt\" style=\"left:4.650%;top:6.000%;width:90.752%;height:20.000%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:4.17cqw;font-weight:650;color:#22452F\">Realistic enough for what?</span></p></div><div class=\"shp txt\" style=\"left:4.650%;top:34.667%;width:90.752%;height:42.667%;justify-content:center\"><p style=\"margin:0 0 .45em 0;text-align:center;margin-left:0.0cqw\"><span style=\"font-size:3.54cqw;color:#1F2430\">Suitability belongs to the pair, not the environment.\nScorecard: stratosphereips.github.io/realism-framework</span></p></div></div>"}, NARR={"1": "Good morning. I'm Yinuo Du, from the University of Texas at El Paso, and this is joint work with Maria Rigaki and Carlos Catania at Czech Technical University in Prague.\n\nThe title is the question we think the field is not asking. We describe environments as realistic, but realistic enough for what?", "2": "Picture a benchmark for an autonomous defender. Attacks generate alerts, but the routine life of the enterprise is barely there: few normal logins, little administrator maintenance, limited file-share access, almost no background traffic.\n\nThe defender scores well. But it scored well because malicious behavior was presented against a clean baseline. That result is valid for the benchmark. It does not support a claim about deployment in an enterprise, where the whole difficulty is separating attacks from noisy legitimate activity.", "3": "This is not only a defensive problem. In NASimEmu, an attack action can succeed deterministically in the simulator and then fail against the corresponding real service in the emulator, because the simulator abstracts away the service and operating-system fidelity that decides whether an exploit actually works. PenGym reports an analogous gap.\n\nSo an agent that looks competent in the abstract configuration need not stay competent against real software. Its score reflects its capability and also which environmental conditions the environment happened to model or omit.", "4": "Environment papers describe what they implement: hosts, vulnerabilities, services, available actions. That tells you what is inside. It does not tell you whether the environment can support a particular evaluation claim.\n\nAlert triage depends on benign activity and telemetry. Privilege escalation depends on identity state, credential artifacts, operating-system behavior, and the consequences of actions. Exfiltration depends on external channels, monitoring, baselines, and defensive controls. Different claims, different requirements.", "5": "That reframing is the whole contribution. We stop asking whether an environment is realistic in general, and start asking whether it contains the realism properties required by a given evaluation objective.\n\nIf you remember one thing from this talk, remember that suitability is not a property of an environment. It is a property of an environment paired with an objective.", "6": "Three steps: derive, mark, grade. Let me take them in order.", "7": "First, we derive realism elements from MITRE ATT&CK and D3FEND. For each technique we record what it requires an environment to provide, to model, or to emit.\n\nClustering those per-technique requirements gives eleven realism dimensions. Under the dimensions sit 115 concrete scoring elements. An element is pitched at the level where a missing property makes a whole class of techniques either inexpressible or unobservable.\n\nNote the direction of derivation. We are not cataloguing what environments happen to implement. We are asking what the techniques demand.", "8": "The eleven dimensions group by which part of the evaluation they affect.\n\nInfrastructure covers topological, service, and operating-system realism: do the network, services, and hosts resemble a real technical system?\n\nOrganizational behavior covers identity, temporal, and benign activity: are there realistic users, credentials, routine activity, and time-dependent behavior?\n\nThe security layer covers defensive controls and telemetry. The agent interface covers action and observation realism. External context covers the ecosystem outside the lab network.", "9": "Second, for a given evaluation objective, we mark each element critical, useful, or unnecessary. Third, we grade how well an environment covers each element as full, partial, absent, or unknown, reading its papers, documentation, and code.\n\nCombining them: importance gives a weight, two for critical and one for useful. Coverage gives a value, one for full, a half for partial, zero for absent. The fit score is the weighted average, from zero to one. Unknown coverage is excluded from the average and instead lowers a separate completeness measure, so ignorance never flatters an environment.", "10": "One rule overrides the fit score. If any critical requirement is absent, the environment is not suitable for that objective, full stop.\n\nWe do this because a weighted average can hide a fatal hole. A single missing critical property can invalidate the evaluation no matter how good everything else looks. Otherwise, an environment is suitable above a threshold, provisionally 0.75, partially suitable below it, and incomplete when too much of the profile is unknown. Those weights and that threshold are provisional, and they are one of the things we want feedback on.", "11": "The clearest way to show what this buys you is to run one environment against two objectives.", "12": "GOAD is an emulated multi-domain Active Directory environment. It gives you realistic Windows hosts, Active Directory services, credentials, and attacker-facing interactions. It has no benign background activity, no defensive monitoring, no telemetry, no temporal dynamics, no external ecosystem.\n\nIn each radar, the dashed polygon is the objective's requirement and the solid polygon is GOAD's coverage. A dimension is met when the solid polygon reaches the dashed contour.\n\nI should be honest about the status of these grades: they are a preliminary, dimension-level reading of GOAD's documentation and code, not element-level scoring.", "13": "For credential-based privilege escalation, the critical requirements are service, operating-system, identity, action, and observation realism. GOAD covers all five fully. The axes it leaves partly unmet, topological and temporal, are only useful, not critical. Fit score 0.88, nothing critical missing, so GOAD is suitable.\n\nFor targeted data exfiltration the requirement extends along the context axes: temporal dynamics, defensive controls, benign activity, telemetry, and external ecosystem are all critical. GOAD is absent on exactly those five. The solid polygon collapses toward the center precisely where the objective needs it to reach. Fit 0.39, five critical requirements unmet, the hard constraint fires, and GOAD is not suitable.\n\nSame environment. Not changed in any way. Suitable for one objective, unsuitable for the other.", "14": "The framework makes limitations explicit by connecting an evaluation claim to the realism properties it requires. The GOAD example is the intended use in miniature: the same environment supports one objective and fails another because the missing properties differ.\n\nThis is different from prior environment taxonomies, which classify environments by the features they implement. We classify by what techniques require.", "15": "I want to be clear about what is not yet done. The framework is designed for element-level scoring across 115 elements, but the current comparison of thirteen publicly inspectable environments uses dimension-level proxy grades over the eleven dimensions. Those grades are a first-pass reading and are not yet validated, so they miss finer distinctions that element-level scoring would surface.\n\nATT&CK and D3FEND are themselves curated abstractions, so the dimension set needs external validation. And we use the enterprise IT matrix; other domains are future work.", "16": "The validation plan is semi-structured interviews with practitioners across offensive, defensive, and environment-development roles. The interviews ask whether the dimensions match how experts actually assess realism, whether any are redundant or missing, and whether the three-level scale is appropriate.\n\nThat addresses two questions: which dimensions practitioners would add, remove, split, or merge, and whether they agree with each other on a dimension's importance for a given objective. We will consolidate the set from the results, and a broader survey follows.", "17": "This is a poster, and the work is preliminary, so I would genuinely like feedback on three things.\n\nFirst, granularity: are eleven dimensions decomposed into 115 scoring elements at the right level? Second, the scale: does critical, useful, not needed adequately represent what an objective requires? Third, the basis: is deriving realism requirements from ATT&CK and D3FEND, rather than cataloguing environment features, the right foundation for comparing environments?", "18": "So, to leave you with one idea: suitability is a property of the environment and the objective together, never of the environment alone.\n\nThe interactive scorecard, the requirement profiles, and the per-environment evaluations are online at the address on the slide. Please come and argue with me at the poster. Thank you."};
const N=Object.keys(FRAGS).length;
let si=1, cur=0;
const host=document.getElementById('host'), narr=document.getElementById('narr'),
      rng=document.querySelector('#bar input');
function steps(){ const t=(NARR[si]||''); return t? t.split(/\n\s*\n/).length : 1; }
function md(t){return t.split(/\n\s*\n/).map(p=>'<p>'+p
 .replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
 .replace(/_(.+?)_/g,'<em>$1</em>')+'</p>').join('');}
function render(){
 const parts=(NARR[si]||'').split(/\n\s*\n/);
 narr.innerHTML=md(parts.slice(0,cur+1).join("\n\n"));
 document.getElementById('count').textContent='slide '+si+' / '+N+
   (si===N&&cur>=steps()-1?' — end':'');
 rng.max=N; rng.value=si; location.hash=si>1?'s'+si:'';
 post({action:'@webframe.resize',size:{height:document.getElementById('wrap').scrollHeight}});
}
function show(){ host.innerHTML=FRAGS[si]||''; render(); }
function jump(n){ si=Math.min(Math.max(1,n),N); cur=0; show(); }
function step(d){
 const M=steps()-1;
 if(d>0){ if(cur<M){cur++;render();} else if(si<N){si++;cur=0;show();} }
 else   { if(cur>0){cur--;render();} else if(si>1){si--;show();cur=steps()-1;render();} }
}
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
 if(e.key===' '||e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1);}
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1);} });
document.getElementById('stage').addEventListener('click',()=>step(1));
function fromHash(){const m=location.hash.match(/^#s(\d+)$/); if(m){si=Math.min(Math.max(1,+m[1]),N);cur=0;show();}}
addEventListener('hashchange',fromHash);
function post(a){ if(window.parent!==window) window.parent.postMessage(a,'*'); }
post({action:'@webframe.ready'});
fromHash(); show();
</script></body></html>
