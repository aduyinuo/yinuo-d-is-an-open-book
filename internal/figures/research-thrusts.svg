<svg xmlns="http://www.w3.org/2000/svg" width="890" height="580" viewBox="84 10 890 580"
     font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2C5F3F"/>
    </marker>
    <marker id="tipMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#98A79C"/>
    </marker>
  </defs>

  <rect id="canvas" x="84" y="10" width="890" height="580" fill="#FFFFFF"/>

  <g id="systems">
    <rect id="box-network"  x="140" y="26" width="300" height="56" rx="8" fill="#F4F8F5" stroke="#DEE7E0"/>
    <rect id="box-operator" x="600" y="26" width="300" height="56" rx="8" fill="#F4F8F5" stroke="#DEE7E0"/>
  </g>
  <g id="system-labels" text-anchor="middle">
    <text x="290" y="49" font-size="14.5" font-weight="600" fill="#3E4A43">Outer world</text>
    <text x="290" y="69" font-size="13" fill="#42514A">The network, its users, and an adversary</text>
    <text x="750" y="49" font-size="14.5" font-weight="600" fill="#3E4A43">Mental world</text>
    <text x="750" y="69" font-size="13" fill="#42514A">How a mind frames a problem</text>
  </g>

  <g id="thrust-boxes" fill="#FFFFFF" stroke="#CBD8CE" stroke-width="1.25">
    <rect id="box-thrust-1" x="140" y="140" width="300" height="78" rx="8"/>
    <rect id="box-thrust-2" x="600" y="140" width="300" height="78" rx="8"/>
    <rect id="box-thrust-4" x="140" y="462" width="300" height="78" rx="8"/>
    <rect id="box-thrust-3" x="600" y="462" width="300" height="78" rx="8"/>
  </g>

  <g id="thrust-badges">
    <g id="badge-1"><circle cx="172" cy="168" r="14" fill="#2C5F3F"/><text x="172" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">I</text></g>
    <g id="badge-2"><circle cx="632" cy="168" r="14" fill="#2C5F3F"/><text x="632" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">II</text></g>
    <g id="badge-4"><circle cx="172" cy="490" r="14" fill="#2C5F3F"/><text x="172" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">IV</text></g>
    <g id="badge-3"><circle cx="632" cy="490" r="14" fill="#2C5F3F"/><text x="632" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">III</text></g>
  </g>

  <g id="thrust-labels" fill="#14181F">
    <text x="198" y="173" font-size="16.5" font-weight="700">Cyber World Modeling</text>
    <text x="198" y="196" font-size="12.5" fill="#42514A">Predicting the network under attack</text>
    <text x="658" y="168" font-size="16.5" font-weight="700">Mental World Modeling</text>
    <text x="658" y="196" font-size="13" fill="#42514A">Problem solving and social world modeling</text>
    <text x="198" y="495" font-size="16.5" font-weight="700">Toward Deployment</text>
    <text x="198" y="518" font-size="13" fill="#42514A">Whether results transfer</text>
    <text x="658" y="495" font-size="16.5" font-weight="700">Human-AI Complementarity</text>
    <text x="658" y="518" font-size="13" fill="#42514A">Who acts, on whose authority</text>
  </g>

  <rect id="box-agent" x="380" y="296" width="280" height="88" rx="10" fill="#E9F1EB" stroke="#2C5F3F" stroke-width="2"/>
  <g id="agent-label" text-anchor="middle">
    <text x="520" y="332" font-size="17" font-weight="700" fill="#14181F">Deployable defense agent</text>
    <text x="520" y="356" font-size="12.5" fill="#3D6249">Capability bounded by</text>
    <text x="520" y="372" font-size="12.5" fill="#3D6249">model fidelity</text>
  </g>

  <g id="flow-arrows" stroke="#2C5F3F" stroke-width="1.5" fill="none" marker-end="url(#tip)">
    <path id="a-network-thrust1"  d="M 290 82 L 290 138"/>
    <path id="a-operator-thrust2" d="M 750 82 L 750 138"/>
    <path id="a-thrust1-agent"    d="M 328 218 L 412 294"/>
    <path id="a-thrust2-agent"    d="M 712 218 L 628 294"/>
    <path id="a-agent-thrust4"    d="M 412 386 L 328 460"/>
    <path id="a-agent-thrust3"    d="M 628 386 L 712 460"/>
  </g>

  <g id="dependency-arrows" stroke="#98A79C" stroke-width="1.25" fill="none"
     stroke-dasharray="6 5" marker-end="url(#tipMuted)">
    <path id="d-mental-to-cyber" d="M 598 170 L 443 170"/>
    <path id="d-cyber-to-mental" d="M 442 192 L 597 192"/>
    <path id="d-thrust4-thrust1" d="M 168 460 L 168 220"/>
    <path id="d-thrust2-thrust3" d="M 872 220 L 872 460"/>
    <path id="d-thrust4-thrust3" d="M 443 501 L 598 501"/>
  </g>

  <g id="flow-labels" text-anchor="middle" font-size="12.5" fill="#2C5F3F">
    <rect x="356" y="406" width="118" height="18" fill="#FFFFFF"/>
    <text x="415" y="419">Fidelity under shift</text>
    <rect x="566" y="406" width="140" height="18" fill="#FFFFFF"/>
    <text x="636" y="419">Authority and delegation</text>
  </g>

  <g id="dependency-labels" text-anchor="middle" font-size="12.5" fill="#42514A">
    <rect x="440" y="146" width="160" height="17" fill="#FFFFFF"/>
    <text x="520" y="159" font-size="11.5">Framing drives behaviour</text>
    <rect x="440" y="200" width="160" height="17" fill="#FFFFFF"/>
    <text x="520" y="213" font-size="11.5">Structure shapes framing</text>
    <rect x="100" y="331" width="136" height="18" fill="#FFFFFF"/>
    <text x="168" y="344">Training environments</text>
    <rect x="786" y="331" width="172" height="18" fill="#FFFFFF"/>
    <text x="872" y="344">Measurable tacit knowledge</text>
    <rect x="452" y="492" width="136" height="18" fill="#FFFFFF"/>
    <text x="520" y="505">Drift and handover</text>
  </g>

  <g id="instruments" font-size="12" fill="#5E6C64">
    <text x="140" y="574">Daedalus &#183; Metrion</text>
    <text x="900" y="574" text-anchor="end">CHART &#183; Cyber-Agent-Flow</text>
  </g>
</svg>
