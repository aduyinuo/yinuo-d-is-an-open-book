<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--d:#22452f;--m:#4a7c59;--l:#93b294;--vl:#e6efe4;--ink:#1f2430;--mute:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
#wrap{max-width:1000px;margin:0 auto;padding:12px 14px 24px}
#stage{position:relative;width:100%;aspect-ratio:__RATIO__;border:1px solid var(--l);
 border-radius:10px;overflow:hidden;background:#fff;container-type:size;cursor:pointer}
.slide{position:absolute;inset:0}
.shp{position:absolute;display:flex;flex-direction:column;overflow:hidden}
.shp.txt{padding:.6cqh .8cqw}
.shp.img img{width:100%;height:100%;object-fit:contain;display:block}
#bar{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:12.5px;color:var(--mute)}
#bar button{font:inherit;font-size:12.5px;border:1px solid var(--l);background:#fff;color:var(--d);
 border-radius:7px;padding:4px 11px;cursor:pointer}
#bar button:hover{background:var(--vl)}
#bar input[type=range]{flex:1;accent-color:var(--m)}
#narr{margin-top:12px;padding:14px 16px;background:var(--vl);border-radius:10px;
 font-size:15px;line-height:1.62;min-height:60px}
#narr p{margin:0 0 10px}#narr p:last-child{margin:0}
#narr strong{color:var(--d)}
#hint{margin-top:8px;font-size:12px;color:var(--mute)}
</style></head><body>
<div id="wrap">
 <div id="stage"><div id="host"></div></div>
 <div id="bar">
  <button onclick="event.stopPropagation();step(-1)">← Prev</button>
  <button onclick="event.stopPropagation();step(1)">Next →</button>
  <span id="count"></span>
  <input type="range" min="1" max="1" value="1" oninput="jump(+this.value)"
         onclick="event.stopPropagation()" title="Jump to slide">
 </div>
 <div id="narr"></div>
 <div id="hint">Arrow keys or space to advance. Any slide is linkable with #s3.</div>
</div>
<script>
const FRAGS=__FRAGS__, NARR=__NARR__;
const N=Object.keys(FRAGS).length;
let si=1, cur=0;
const host=document.getElementById('host'), narr=document.getElementById('narr'),
      rng=document.querySelector('#bar input');
function steps(){ const t=(NARR[si]||''); return t? t.split(/\n\s*\n/).length : 1; }
function md(t){return t.split(/\n\s*\n/).map(p=>'<p>'+p
 .replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
 .replace(/_(.+?)_/g,'<em>$1</em>')+'</p>').join('');}
function render(){
 const parts=(NARR[si]||'').split(/\n\s*\n/);
 narr.innerHTML=md(parts.slice(0,cur+1).join("\n\n"));
 document.getElementById('count').textContent='slide '+si+' / '+N+
   (si===N&&cur>=steps()-1?' — end':'');
 rng.max=N; rng.value=si; location.hash=si>1?'s'+si:'';
 post({action:'@webframe.resize',size:{height:document.getElementById('wrap').scrollHeight}});
}
function show(){ host.innerHTML=FRAGS[si]||''; render(); }
function jump(n){ si=Math.min(Math.max(1,n),N); cur=0; show(); }
function step(d){
 const M=steps()-1;
 if(d>0){ if(cur<M){cur++;render();} else if(si<N){si++;cur=0;show();} }
 else   { if(cur>0){cur--;render();} else if(si>1){si--;show();cur=steps()-1;render();} }
}
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
 if(e.key===' '||e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1);}
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1);} });
document.getElementById('stage').addEventListener('click',()=>step(1));
function fromHash(){const m=location.hash.match(/^#s(\d+)$/); if(m){si=Math.min(Math.max(1,+m[1]),N);cur=0;show();}}
addEventListener('hashchange',fromHash);
function post(a){ if(window.parent!==window) window.parent.postMessage(a,'*'); }
post({action:'@webframe.ready'});
fromHash(); show();
</script></body></html>
